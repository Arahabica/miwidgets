<!-- 時計テンプレート 案4「World Clock」: 複数の都市の時刻を並べるワールドクロック。昼と夜で色が変わり、先頭の都市との時差と日付差を表示する。都市とタイムゾーンはスクリプト冒頭の data で変更できる。 -->
<div id="ck4"><div class="ti"></div><div class="grid"></div></div>
<style>
#ck4{box-sizing:border-box;width:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%;}
#ck4 *{box-sizing:border-box;}
#ck4 button{font:inherit;color:inherit;}

#ck4{padding:14px 12px 14px;color:var(--hatch-widget-text,#1c1c1e);}
#ck4 .ti{font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--hatch-widget-muted,#6e6e73);margin:0 4px 10px;}
#ck4 .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
#ck4 .cd{text-align:center;padding:12px 8px 10px;border-radius:18px;border:1px solid var(--hatch-widget-border,#d1d1d6);background:linear-gradient(180deg,#fff7e0,#ffe9b8);color:#3a2d12;transition:background .4s;}
#ck4 .cd.nt{background:linear-gradient(180deg,#232a5c,#121534);color:#e6e9ff;border-color:transparent;}
#ck4 .nm{font-size:13px;font-weight:700;}
#ck4 .cd svg{display:block;width:78%;aspect-ratio:1;margin:8px auto 6px;overflow:visible;}
#ck4 .fc{fill:rgba(255,255,255,.55);stroke:currentColor;stroke-opacity:.25;stroke-width:2;}
#ck4 .cd.nt .fc{fill:rgba(255,255,255,.06);}
#ck4 .tk,#ck4 .hh line,#ck4 .mh line{stroke:currentColor;}
#ck4 .pv{fill:currentColor;}
#ck4 .tm{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.04em;}
#ck4 .sb{font-size:11px;opacity:.7;margin-top:1px;}

</style>
<script>
(function(){
var R = document.getElementById("ck4");
try {
/* Muse 以外のブラウザでも動くよう、hatchWidget が無ければメモリ上の代替を使う */
var HW = window.hatchWidget || (function(){ var s = null; return { getState: function(d){ return s === null ? d : s; }, setState: function(v){ s = v; } }; })();

/* ===== data: 表示内容はすべてここで変える ===== */
var data = {
  title: 'World Clock',        // string: 見出し
  cities: [                    // 型: { label: string, timezone: string }[] ・2〜6件程度。先頭の都市が時差の基準になる
    { label: '東京',         timezone: 'Asia/Tokyo' },
    { label: 'ニューヨーク', timezone: 'America/New_York' },
    { label: 'ロンドン',     timezone: 'Europe/London' },
    { label: 'シドニー',     timezone: 'Australia/Sydney' }
  ]
};

function parts(tz){
  var o = { hourCycle: 'h23', hour: '2-digit', minute: '2-digit', second: '2-digit', year: 'numeric', month: 'numeric', day: 'numeric', weekday: 'short' }, m = {};
  function run(){ new Intl.DateTimeFormat('ja-JP', o).formatToParts(new Date()).forEach(function(p){ m[p.type] = p.value; }); }
  try { if (tz) o.timeZone = tz; run(); } catch (e) { delete o.timeZone; run(); } // 不正なタイムゾーンは端末の地域で代用
  return { h: +m.hour, mi: +m.minute, s: +m.second, y: +m.year, mo: +m.month, d: +m.day, wd: m.weekday };
}
function p2(n){ return (n < 10 ? '0' : '') + n; }
function dateText(p){ return p.y + '年' + p.mo + '月' + p.d + '日(' + p.wd + ')'; }
/* アナログ時計の文字盤(viewBox 0 0 200 200)。full=false なら目盛りは12個だけ */
function analog(full){
  var t = '', i, a, big, r1, r2;
  for (i = 0; i < (full ? 60 : 12); i++) {
    a = i * (full ? 6 : 30) * Math.PI / 180; big = !full || i % 5 === 0; r1 = big ? 80 : 89; r2 = 96;
    t += '<line class="tk" x1="' + (100 + r1 * Math.sin(a)).toFixed(1) + '" y1="' + (100 - r1 * Math.cos(a)).toFixed(1) + '" x2="' + (100 + r2 * Math.sin(a)).toFixed(1) + '" y2="' + (100 - r2 * Math.cos(a)).toFixed(1) + '" stroke-width="' + (big ? (full ? 3 : 5) : 1.4) + '" stroke-linecap="round"/>';
  }
  if (full) [[12, 100, 38], [3, 162, 100], [6, 100, 162], [9, 38, 100]].forEach(function(n){ t += '<text class="nu" x="' + n[1] + '" y="' + n[2] + '" text-anchor="middle" dominant-baseline="central">' + n[0] + '</text>'; });
  return t + '<g class="hh"><line x1="100" y1="104" x2="100" y2="' + (full ? 52 : 50) + '" stroke-width="' + (full ? 7 : 9) + '" stroke-linecap="round"/></g>' +
    '<g class="mh"><line x1="100" y1="106" x2="100" y2="' + (full ? 30 : 28) + '" stroke-width="' + (full ? 4.5 : 6) + '" stroke-linecap="round"/></g>' +
    (full ? '<g class="sh"><line x1="100" y1="118" x2="100" y2="22" stroke-width="2" stroke-linecap="round"/></g>' : '') +
    '<circle cx="100" cy="100" r="' + (full ? 5 : 6) + '" class="pv"/>';
}
function hands(root, p){
  function rot(c, deg){ var g = root.querySelector(c); if (g) g.setAttribute('transform', 'rotate(' + deg.toFixed(1) + ' 100 100)'); }
  rot('.hh', (p.h % 12 + p.mi / 60) * 30); rot('.mh', (p.mi + p.s / 60) * 6); rot('.sh', p.s * 6);
}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
R.querySelector('.ti').textContent = data.title;
R.querySelector('.grid').innerHTML = data.cities.map(function(c){
  return '<div class="cd"><div class="nm">' + esc(c.label) + '</div><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="98" class="fc"/>' + analog(false) + '</svg><div class="tm"></div><div class="sb"></div></div>';
}).join('');
function utc(p){ return Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi); }
function tick(){
  var base = parts(data.cities[0].timezone);
  R.querySelectorAll('.cd').forEach(function(el, i){
    var c = data.cities[i], p = parts(c.timezone), diff = (utc(p) - utc(base)) / 60000, dd = Math.round((Date.UTC(p.y, p.mo - 1, p.d) - Date.UTC(base.y, base.mo - 1, base.d)) / 86400000);
    hands(el, p);
    el.classList.toggle('nt', p.h < 6 || p.h >= 18);
    el.querySelector('.tm').textContent = p2(p.h) + ':' + p2(p.mi);
    el.querySelector('.sb').textContent = i === 0 ? '基準' : (dd < 0 ? '昨日' : dd > 0 ? '明日' : '今日') + ' · ' + (diff >= 0 ? '+' : '−') + Math.abs(diff / 60) + '時間';
  });
}
tick(); setInterval(tick, 1000);

} catch (e) { R.innerHTML = '<pre style="margin:0;padding:12px;font-size:12px;color:#d33;white-space:pre-wrap;">' + String(e) + '</pre>'; }
})();
</script>
