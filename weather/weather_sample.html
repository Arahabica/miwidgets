<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天気ウィジェット プレビュー(Muse チャット画面の再現)</title>
<!--
  Muse のモバイルチャット画面を模したプレビュー用ページ。
  天気ウィジェットを fetch で読み込み、天気の違う複数のデータで吹き出しの中に表示する。
  各シナリオは、読み込んだ weather.html の data を Object.assign で上書きして作る(weather.html 自体は1つだけ)。
  ※ 見た目は推測による再現で、実際の Muse の画面とは異なる。
  ※ fetch を使うため、ローカルサーバー経由で開く必要がある(file:// では読み込めない)。
     例: cd weather && python3 -m http.server 8000 → http://localhost:8000/weather_sample.html
-->
<style>
:root{
  --page-bg:#ffffff;
  --bubble-user-bg:#3a5ad1;
  --bubble-user-text:#ffffff;
  --bubble-ai-bg:#f2f2f7;
  --bubble-ai-text:#1c1c1e;
  --meta-text:#8e8e93;
  /* Muse がウィジェットに渡すテーマ変数(推測) */
  --hatch-widget-text:#1c1c1e;
  --hatch-widget-muted:#6e6e73;
  --hatch-widget-border:#d1d1d6;
}
@media (prefers-color-scheme: dark){
  :root{
    --page-bg:#000000;
    --bubble-ai-bg:#2c2c2e;
    --bubble-ai-text:#f2f2f7;
    --meta-text:#8e8e93;
    --hatch-widget-text:#f2f2f7;
    --hatch-widget-muted:#98989f;
    --hatch-widget-border:#3a3a3c;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:#d9d9de;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%;
}
@media (prefers-color-scheme: dark){ body{background:#111;} }

/* スマホ画面。PCでは幅390pxの端末風、実機ではそのまま全画面 */
.phone{
  display:flex;flex-direction:column;
  width:100%;max-width:390px;min-height:100vh;min-height:100dvh;
  margin:0 auto;
  background:var(--page-bg);
  position:relative;
}
@media (min-width:430px){
  body{display:flex;align-items:flex-start;justify-content:center;padding:24px 0;}
  .phone{border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.25);}
}

.chat{flex:1;padding:44px 12px 24px;display:flex;flex-direction:column;gap:10px;}
.stamp{align-self:center;font-size:11px;color:var(--meta-text);margin:2px 0;}

.msg{max-width:88%;}
.msg.user{align-self:flex-end;}
.msg.ai{align-self:flex-start;width:100%;max-width:100%;}
.bubble{border-radius:18px;font-size:14px;line-height:1.55;padding:9px 13px;overflow-wrap:anywhere;}
.msg.user .bubble{background:var(--bubble-user-bg);color:var(--bubble-user-text);border-bottom-right-radius:6px;}
.msg.ai .bubble{background:var(--bubble-ai-bg);color:var(--bubble-ai-text);border-bottom-left-radius:6px;}
/* ウィジェット入りの吹き出し: 余白をなくし、中身を角丸の内側に収める */
.msg.ai .bubble.widget{padding:0;overflow:hidden;}
.label{align-self:flex-start;font-size:11px;color:var(--meta-text);margin:8px 4px -4px;letter-spacing:.04em;}
</style>
</head>
<body>
<div class="phone">
  <div class="chat" id="chat">
    <div class="stamp">今日 9:41</div>

    <div class="msg user"><div class="bubble">いろんな天気を見せて</div></div>
    <div class="msg ai"><div class="bubble">各地の今日の天気です。</div></div>
  </div>
</div>
<script>
/* 表示する天気のシナリオ。data が null のものは weather.html の data そのまま。
 * data には weather.html の data のうち、上書きしたい項目だけを書く(today / hourly / location / updatedAt など)。 */
var SCENARIOS = [
  { label: '雨(weather.html の初期データ)', data: null },
  { label: '晴れ', data: {
      location: '大阪府 大阪市',
      today: { date: '11/17(火)', condition: 'sunny', temp: 22, high: 25, low: 14, pop: 10 },
      hourly: [
        { time: '0時',  condition: 'moon',   temp: 15, pop: 0 },
        { time: '6時',  condition: 'sunny',  temp: 17, pop: 0, current: true },
        { time: '12時', condition: 'sunny',  temp: 24, pop: 10 },
        { time: '18時', condition: 'partly', temp: 21, pop: 10 }
      ] } },
  { label: '晴れ時々くもり', data: {
      location: '宮城県 仙台市',
      today: { date: '11/17(火)', condition: 'partly', temp: 19, high: 21, low: 13, pop: 20 },
      hourly: [
        { time: '0時',  condition: 'moon',   temp: 13, pop: 10 },
        { time: '6時',  condition: 'partly', temp: 15, pop: 10, current: true },
        { time: '12時', condition: 'partly', temp: 20, pop: 20 },
        { time: '18時', condition: 'cloudy', temp: 18, pop: 30 }
      ] } },
  { label: 'くもり', data: {
      location: '愛知県 名古屋市',
      today: { date: '11/17(火)', condition: 'cloudy', temp: 17, high: 19, low: 12, pop: 30 },
      hourly: [
        { time: '0時',  condition: 'cloudy', temp: 13, pop: 20 },
        { time: '6時',  condition: 'cloudy', temp: 14, pop: 30, current: true },
        { time: '12時', condition: 'cloudy', temp: 18, pop: 30 },
        { time: '18時', condition: 'partly', temp: 16, pop: 20 }
      ] } },
  { label: '雷雨', data: {
      location: '福岡県 福岡市',
      today: { date: '11/17(火)', condition: 'thunder', temp: 27, high: 30, low: 22, pop: 90 },
      hourly: [
        { time: '0時',  condition: 'cloudy',  temp: 23, pop: 40 },
        { time: '6時',  condition: 'thunder', temp: 24, pop: 70, current: true },
        { time: '12時', condition: 'thunder', temp: 29, pop: 90 },
        { time: '18時', condition: 'rain',    temp: 25, pop: 60 }
      ] } },
  { label: '雪', data: {
      location: '北海道 札幌市',
      today: { date: '11/17(火)', condition: 'snow', temp: -1, high: 2, low: -4, pop: 70 },
      hourly: [
        { time: '0時',  condition: 'snow',   temp: -3, pop: 60 },
        { time: '6時',  condition: 'snow',   temp: -2, pop: 70, current: true },
        { time: '12時', condition: 'cloudy', temp: 1,  pop: 40 },
        { time: '18時', condition: 'cloudy', temp: -1, pop: 20 }
      ] } },
  { label: '夜', data: {
      location: '京都府 京都市',
      updatedAt: '11/17 21:00 更新',
      today: { date: '11/17(火)', condition: 'moon', temp: 12, high: 15, low: 9, pop: 10 },
      hourly: [
        { time: '0時',  condition: 'moon',  temp: 10, pop: 0 },
        { time: '6時',  condition: 'moon',  temp: 9,  pop: 0 },
        { time: '12時', condition: 'sunny', temp: 14, pop: 0 },
        { time: '18時', condition: 'moon',  temp: 12, pop: 10, current: true }
      ] } }
];

/* weather.html を1回だけ読み込み、シナリオごとに id を付け替え、data を上書きして差し込む */
var chat = document.getElementById('chat');
fetch('weather.html', {cache: 'no-store'})
  .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(function(src){
    SCENARIOS.forEach(function(sc, i){
      var label = document.createElement('div');
      label.className = 'label';
      label.textContent = sc.label;
      var msg = document.createElement('div');
      msg.className = 'msg ai';
      msg.innerHTML = '<div class="bubble widget"></div>';
      chat.appendChild(label);
      chat.appendChild(msg);
      // 同じページに複数置くため、id を重複させない
      var html = src.split('wx1b').join('wx1b_' + i);
      // data の定義の直後に、上書きの1行を差し込む
      if (sc.data) {
        html = html.replace(/(var data = \{[\s\S]*?\n\};)/, function(m){ return m + '\nObject.assign(data, ' + JSON.stringify(sc.data) + ');'; });
      }
      var mount = msg.firstChild;
      mount.innerHTML = html;
      // innerHTML で差し込んだ <script> は実行されないため、作り直して実行させる
      mount.querySelectorAll('script').forEach(function(old){
        var el = document.createElement('script');
        el.textContent = old.textContent;
        old.replaceWith(el);
      });
    });
  })
  .catch(function(err){
    var box = document.createElement('div');
    box.style.cssText = 'padding:12px;font-size:12px;line-height:1.6;color:#d33;';
    box.innerHTML = 'weather.html を読み込めません(' + String(err).replace(/</g, '&lt;') + ')。<br>file:// で開いている場合は、ローカルサーバー経由で開いてください:<br><code>cd weather &amp;&amp; python3 -m http.server 8000</code>';
    chat.appendChild(box);
  });
</script>
</body>
</html>
