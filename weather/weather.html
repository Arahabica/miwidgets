<!-- 天気ウィジェット「Aurora Glass」: 天気に応じて空のグラデーションが変わり、すりガラス風のパネルに6時間ごとの天気を気温の曲線グラフで表示。表示内容・色はすべて data で変更できる。 -->
<div id="wx1b" style="min-height:330px;"></div>
<style>
#wx1b{position:relative;box-sizing:border-box;width:100%;padding:16px 16px 14px;border-radius:18px;overflow:hidden;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;}
#wx1b::before{content:"";position:absolute;right:-70px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,var(--ac) 0%,transparent 66%);opacity:.5;filter:blur(8px);}
#wx1b::after{content:"";position:absolute;left:-90px;bottom:-110px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28) 0%,transparent 65%);}
#wx1b > *{position:relative;z-index:1;}
#wx1b .top{display:flex;justify-content:space-between;align-items:center;}
#wx1b .loc{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:700;letter-spacing:.02em;}
#wx1b .upd{font-size:10.5px;opacity:.75;}
#wx1b .hero{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
#wx1b .temp{font-size:78px;font-weight:200;line-height:1;letter-spacing:-.05em;text-shadow:0 2px 18px rgba(0,0,0,.18);}
#wx1b .temp sup{font-size:34px;font-weight:300;vertical-align:top;position:relative;top:7px;margin-left:2px;}
#wx1b .ico{filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));margin-right:4px;}
#wx1b .cond{display:flex;align-items:baseline;gap:8px;margin-top:0;font-size:21px;font-weight:700;}
#wx1b .cond small{font-size:12px;font-weight:400;opacity:.8;}
#wx1b .chips{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;}
#wx1b .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.28);font-size:12px;font-weight:600;}
#wx1b .glass{margin-top:15px;padding:10px 6px 11px;border-radius:16px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.26);box-shadow:0 8px 24px rgba(0,0,0,.12) inset;}
#wx1b .gt{font-size:11px;opacity:.85;margin:0 8px 8px;letter-spacing:.08em;}
.wx-spin{animation:wxSpin 28s linear infinite}
.wx-fall{animation:wxFall 1.2s linear infinite}
.wx-flash{animation:wxFlash 2.6s infinite}
.wx-drift{animation:wxDrift 6s ease-in-out infinite alternate}
.wx-twinkle{animation:wxTwinkle 2.4s ease-in-out infinite}
@keyframes wxSpin{to{transform:rotate(360deg)}}
@keyframes wxFall{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(7px);opacity:0}}
@keyframes wxFlash{0%,58%,100%{opacity:1}62%{opacity:.15}66%{opacity:1}70%{opacity:.3}}
@keyframes wxDrift{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
@keyframes wxTwinkle{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.wx-spin,.wx-fall,.wx-flash,.wx-drift,.wx-twinkle{animation:none}}
</style>
<script>
(function(){
var data = {
  /* ---- 表示テキスト ---------------------------------------------
   * 型: { [キー]: string } ・すべて必須
   */
  text: {
    popLabel: '降水確率',          // string: 降水確率のラベル
    highLabel: '最高',             // string: 最高気温のラベル
    lowLabel: '最低',              // string: 最低気温のラベル
    hourlyTitle: '6時間ごとの天気', // string: 時間別エリアの見出し
    unitTemp: '°',                 // string: 気温の単位
    unitPop: '%'                   // string: 降水確率の単位
  },

  /* ---- 地域・更新時刻 -------------------------------------------
   * 型: string
   */
  location: '東京都 千代田区',     // string: 地域名
  updatedAt: '11/17 09:00 更新',   // string: 更新時刻の表示(そのまま出す)

  /* ---- 今日の天気 -----------------------------------------------
   * 型: { date: string, condition: ConditionKey, temp: number, high: number, low: number, pop: number }
   *   condition: 'sunny' | 'moon' | 'partly' | 'cloudy' | 'rain' | 'thunder' | 'snow'
   *   temp/high/low: 気温(℃) ・ pop: 降水確率(0〜100)
   */
  today: { date: '11/17(火)', condition: 'rain', temp: 14, high: 17, low: 11, pop: 80 },

  /* ---- 6時間ごとの天気(その日の0時から6時間ごと) -------------
   * 型: { time: string, condition: ConditionKey, temp: number, pop: number, current?: boolean }[]
   *   time: 表示する時刻の文字列(例: '0時', '6時')。件数は4〜6件を想定
   *   current: true にすると、現在の時間帯として強調表示する(省略可。1件だけ指定)
   */
  hourly: [
    { time: '0時',  condition: 'moon',   temp: 11, pop: 10 },
    { time: '6時',  condition: 'rain',   temp: 13, pop: 80, current: true },
    { time: '12時', condition: 'cloudy', temp: 16, pop: 50 },
    { time: '18時', condition: 'partly', temp: 15, pop: 20 }
  ],
  /* ---- 天気ごとの配色 -------------------------------------------
   * 型: { [ConditionKey]: { label: string, bg: [string, string, string], accent: string } }
   *   label: 天気の表示名 ・ bg: 背景グラデーションの3色(上→下) ・ accent: 強調色
   */
  conditions: {
    sunny:   { label: '晴れ',           bg: ['#2b7de9', '#5db7ff', '#ffcf70'], accent: '#ffd166' },
    moon:    { label: '晴れ(夜)',       bg: ['#0b1437', '#1b2a6b', '#4b3f8f'], accent: '#c9b8ff' },
    partly:  { label: '晴れ時々くもり', bg: ['#3a7bd5', '#7fb5e8', '#cfd9e8'], accent: '#ffe08a' },
    cloudy:  { label: 'くもり',         bg: ['#56667d', '#8191a7', '#b8c2cf'], accent: '#e3ecf7' },
    rain:    { label: '雨',             bg: ['#1b2842', '#34507b', '#5d82ad'], accent: '#7fd0ff' },
    thunder: { label: '雷雨',           bg: ['#18142f', '#382d63', '#68509b'], accent: '#ffd84d' },
    snow:    { label: '雪',             bg: ['#5a7aa1', '#8aacd0', '#cfe0f0'], accent: '#ffffff' }
  }
};
/* ---- 天気アイコン(インラインSVG) ---- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var WX_DEFS = '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>'
  + '<linearGradient id="wxSun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ff9a1f"/></linearGradient>'
  + '<linearGradient id="wxMoon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6c8"/><stop offset="1" stop-color="#f0c35a"/></linearGradient>'
  + '<linearGradient id="wxCloud" gradientUnits="userSpaceOnUse" x1="0" y1="19" x2="0" y2="47"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d7ee"/></linearGradient>'
  + '<linearGradient id="wxCloudDk" gradientUnits="userSpaceOnUse" x1="0" y1="19" x2="0" y2="47"><stop offset="0" stop-color="#c3cde0"/><stop offset="1" stop-color="#7d8ba6"/></linearGradient>'
  + '<linearGradient id="wxBolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff08a"/><stop offset="1" stop-color="#ffb400"/></linearGradient>'
  + '</defs></svg>';
function wxCloudShape(dk){ return '<g fill="url(#' + (dk ? 'wxCloudDk' : 'wxCloud') + ')"><circle cx="22" cy="38" r="9"/><circle cx="33" cy="31" r="12"/><circle cx="46" cy="38" r="8"/><rect x="22" y="38" width="24" height="9" rx="4"/></g>'; }
function wxRays(cx, cy, r1, r2, w){
  var s = '';
  for (var i = 0; i < 8; i++) {
    var a = i * Math.PI / 4, c = Math.cos(a), n = Math.sin(a);
    s += '<line x1="' + (cx + r1 * c).toFixed(1) + '" y1="' + (cy + r1 * n).toFixed(1) + '" x2="' + (cx + r2 * c).toFixed(1) + '" y2="' + (cy + r2 * n).toFixed(1) + '" stroke="#ffc13a" stroke-width="' + w + '" stroke-linecap="round"/>';
  }
  return s;
}
function wxDrops(xs, y1, y2, color){
  return xs.map(function(x, i){ return '<line class="wx-fall" style="animation-delay:' + (i * 0.35) + 's" x1="' + x + '" y1="' + y1 + '" x2="' + (x - 2) + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="3" stroke-linecap="round"/>'; }).join('');
}
var WX_BODY = {
  sunny: function(){ return '<g class="wx-spin" style="transform-origin:32px 32px">' + wxRays(32, 32, 19, 26, 3.5) + '</g><circle cx="32" cy="32" r="12.5" fill="url(#wxSun)"/>'; },
  moon: function(){ return '<path d="M38 11a21 21 0 1 0 15 31 17 17 0 0 1-15-31z" fill="url(#wxMoon)"/><circle class="wx-twinkle" cx="50" cy="16" r="1.7" fill="#fff6c8"/><circle class="wx-twinkle" style="animation-delay:.9s" cx="57" cy="27" r="1.2" fill="#fff6c8"/>'; },
  partly: function(){ return '<g class="wx-spin" style="transform-origin:23px 23px">' + wxRays(23, 23, 13, 18, 3) + '</g><circle cx="23" cy="23" r="9" fill="url(#wxSun)"/><g transform="translate(5,8)"><g class="wx-drift">' + wxCloudShape(false) + '</g></g>'; },
  cloudy: function(){ return '<g transform="translate(14,-8) scale(.8)"><g class="wx-drift" style="animation-delay:-2s">' + wxCloudShape(true) + '</g></g><g transform="translate(0,3)"><g class="wx-drift">' + wxCloudShape(false) + '</g></g>'; },
  rain: function(){ return '<g transform="translate(0,-5)">' + wxCloudShape(true) + '</g>' + wxDrops([24, 33, 42], 46, 54, '#5bb8ff'); },
  thunder: function(){ return '<g transform="translate(0,-7)">' + wxCloudShape(true) + '</g><polygon class="wx-flash" points="35,38 26,51 32,51 28,62 41,46 34,46 39,38" fill="url(#wxBolt)"/>'; },
  snow: function(){ return '<g transform="translate(0,-5)">' + wxCloudShape(false) + '</g>' + [24, 33, 42].map(function(x, i){ return '<circle class="wx-fall" style="animation-delay:' + (i * 0.45) + 's" cx="' + x + '" cy="49" r="2.4" fill="#fff" stroke="#9fc1e6" stroke-width=".8"/>'; }).join(''); }
};
function wxIcon(kind, px){
  var f = WX_BODY[kind] || WX_BODY.cloudy;
  return '<svg viewBox="0 0 64 64" width="' + px + '" height="' + px + '" aria-hidden="true" style="display:block;overflow:visible">' + f() + '</svg>';
}
var root = document.getElementById('wx1b');
try {
  function cd(k){ return data.conditions[k] || data.conditions.cloudy; }
  var t = data.text, td = data.today, c = cd(td.condition);
  root.style.background = 'linear-gradient(160deg,' + c.bg[0] + ' 0%,' + c.bg[1] + ' 55%,' + c.bg[2] + ' 100%)';
  root.style.setProperty('--ac', c.accent);
  var pin = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>';
  var drop = '<svg width="11" height="13" viewBox="0 0 24 28" fill="currentColor"><path d="M12 1C8 8 3 12.5 3 18a9 9 0 0 0 18 0c0-5.5-5-10-9-17z"/></svg>';
  var hs = data.hourly, n = hs.length;
  var W = 330, H = 140, px = 34, top = 58, ph = 36;
  var tmin = Math.min.apply(null, hs.map(function(h){ return h.temp; })), tmax = Math.max.apply(null, hs.map(function(h){ return h.temp; }));
  var span = (tmax - tmin) || 1;
  var P = hs.map(function(h, i){ return [px + i * ((W - px * 2) / (n - 1 || 1)), top + (tmax - h.temp) * (ph / span)]; });
  var dd = 'M' + P[0][0].toFixed(1) + ',' + P[0][1].toFixed(1);
  for (var i = 1; i < n; i++) { var mx = (P[i-1][0] + P[i][0]) / 2; dd += ' C' + mx.toFixed(1) + ',' + P[i-1][1].toFixed(1) + ' ' + mx.toFixed(1) + ',' + P[i][1].toFixed(1) + ' ' + P[i][0].toFixed(1) + ',' + P[i][1].toFixed(1); }
  var area = dd + ' L' + P[n-1][0].toFixed(1) + ',' + (H - 26) + ' L' + P[0][0].toFixed(1) + ',' + (H - 26) + ' Z';
  var colW = n > 1 ? (W - px * 2) / (n - 1) : 80;
  var curve = '<svg viewBox="0 0 ' + W + ' ' + (H + 14) + '" style="width:100%;display:block;"><defs><linearGradient id="wx1bA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>';
  hs.forEach(function(h, i){
    if (h.current) curve += '<rect x="' + (P[i][0] - colW * 0.36).toFixed(1) + '" y="0" width="' + (colW * 0.72).toFixed(1) + '" height="' + (H + 14) + '" rx="12" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.34)"/>';
  });
  curve += '<path d="' + area + '" fill="url(#wx1bA)"/><path d="' + dd + '" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".92"/>';
  hs.forEach(function(h, i){
    var x = P[i][0], y = P[i][1];
    curve += '<svg x="' + (x - 15) + '" y="4" width="30" height="30" viewBox="0 0 64 64" style="overflow:visible">' + (WX_BODY[h.condition] || WX_BODY.cloudy)() + '</svg>';
    curve += '<text x="' + x + '" y="' + (y - 9) + '" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" stroke="rgba(10,30,70,.3)" stroke-width="2.4" stroke-linejoin="round" paint-order="stroke">' + h.temp + esc(t.unitTemp) + '</text>';
    curve += '<circle cx="' + x + '" cy="' + y + '" r="' + (h.current ? 4.8 : 3.6) + '" fill="' + (h.current ? c.accent : 'rgba(255,255,255,.2)') + '" stroke="#fff" stroke-width="2"/>';
    curve += '<text x="' + x + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11"' + (h.current ? ' font-weight="700"' : '') + ' fill="#fff" stroke="rgba(10,30,70,.3)" stroke-width="2.4" stroke-linejoin="round" paint-order="stroke">' + esc(h.time) + '</text>';
    curve += '<text x="' + x + '" y="' + (H + 5) + '" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fff" stroke="rgba(10,30,70,.4)" stroke-width="2.6" stroke-linejoin="round" paint-order="stroke">' + h.pop + esc(t.unitPop) + '</text>';
  });
  curve += '</svg>';
  root.innerHTML = WX_DEFS
    + '<div class="top"><div class="loc">' + pin + esc(data.location) + '</div><div class="upd">' + esc(data.updatedAt) + '</div></div>'
    + '<div class="hero"><div class="temp">' + td.temp + '<sup>' + esc(t.unitTemp) + '</sup></div><div class="ico">' + wxIcon(td.condition, 96) + '</div></div>'
    + '<div class="cond">' + esc(c.label) + '<small>' + esc(td.date) + '</small></div>'
    + '<div class="chips"><span class="chip">' + esc(t.highLabel) + ' ' + td.high + t.unitTemp + ' / ' + esc(t.lowLabel) + ' ' + td.low + t.unitTemp + '</span><span class="chip">' + drop + esc(t.popLabel) + ' ' + td.pop + t.unitPop + '</span></div>'
    + '<div class="glass"><div class="gt">' + esc(t.hourlyTitle) + '</div>' + curve + '</div>';
} catch (err) {
  root.innerHTML = '<pre style="white-space:pre-wrap;color:#fdd;font-size:11px;">ERROR: ' + String(err && err.stack || err).replace(/</g, '&lt;') + '</pre>';
}
})();
</script>
