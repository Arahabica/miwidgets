<!-- FIFA形式。横軸はその時点の最大値に合わせ、右下に時点を表示する。表示内容は data で変更できる。 -->
<meta charset="utf-8">
<div id="bar_chart_race">
  <header><h2></h2></header>
  <div class="scale"><span class="unit"></span><div class="ticks"></div></div>
  <div class="plot"><div class="grid" aria-hidden="true"></div><div class="rows" role="list"></div></div>
  <div class="dateline">
    <div class="controls">
      <button type="button" class="play" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="pause-symbol" d="M6 4h4v16H6zm8 0h4v16h-4z"/><path class="play-symbol" d="M7 4v16l13-8z"/></svg>
      </button>
      <button type="button" class="restart" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"/><path d="M4.5 9.5a8 8 0 1 1 0 5"/></svg>
      </button>
    </div>
    <strong class="period"></strong>
  </div>
  <p class="note" hidden></p>
</div>
<style>
#bar_chart_race{--step:30px;--names:clamp(67px,24%,126px);--numbers:46px;--icon-size:18px;--gap:4px;
  --ink:var(--hatch-widget-text,#18263c);--sub:var(--hatch-widget-muted,#54647a);--line:var(--hatch-widget-border,#dce3eb);--accent:#3972b4;
  position:relative;box-sizing:border-box;width:100%;padding:16px 13px 10px;color:var(--ink);
  font:13px/1.3 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;font-variant-numeric:tabular-nums;}
#bar_chart_race *,#bar_chart_race *::before{box-sizing:border-box;}
#bar_chart_race [hidden]{display:none!important;}
#bar_chart_race header{padding-bottom:11px;}
#bar_chart_race h2{margin:0;font-size:clamp(18px,5vw,26px);line-height:1.24;font-weight:760;overflow-wrap:anywhere;}
#bar_chart_race .scale{height:24px;position:relative;color:var(--sub);font-size:10px;}
#bar_chart_race .unit{position:absolute;left:0;bottom:4px;font-weight:650;max-width:var(--names);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#bar_chart_race .ticks,#bar_chart_race .grid,#bar_chart_race .track{position:absolute;left:var(--names);right:var(--numbers);}
#bar_chart_race .ticks{bottom:4px;height:1em;}
#bar_chart_race .tick{position:absolute;transform:translateX(-50%);line-height:1;}
#bar_chart_race .plot{position:relative;overflow:hidden;}
#bar_chart_race .grid{inset-block:0;}
#bar_chart_race .grid i{position:absolute;inset-block:0;border-left:1px solid var(--line);}
#bar_chart_race .row{position:absolute;inset:0 0 auto;height:var(--step);}
#bar_chart_race .name{position:absolute;left:0;width:var(--names);height:100%;padding-right:7px;display:flex;align-items:center;justify-content:flex-end;gap:4px;}
#bar_chart_race .name b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600;}
#bar_chart_race .track{top:3px;bottom:3px;}
#bar_chart_race .bar{height:100%;position:relative;background:var(--color);}
#bar_chart_race .tip{position:absolute;left:100%;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:var(--gap);padding-left:var(--gap);width:max-content;}
#bar_chart_race .tip.inset{transform:translate(calc(0px - var(--icon-size) - var(--gap)),-50%);}
#bar_chart_race .tip.inset .icon{position:relative;right:var(--gap);}
#bar_chart_race .value{color:var(--ink);white-space:nowrap;font-size:11px;font-weight:650;}
#bar_chart_race .icon{width:var(--icon-size);height:var(--icon-size);object-fit:contain;}
#bar_chart_race .dateline{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:50px;padding:5px 0;}
#bar_chart_race .note{margin:4px 0 0;color:var(--sub);font-size:12px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-line;}
#bar_chart_race .period{margin-left:auto;color:var(--ink);font-size:clamp(26px,8vw,40px);line-height:1.05;letter-spacing:-.045em;overflow-wrap:anywhere;text-align:right;}
#bar_chart_race .controls{display:flex;flex:none;align-items:center;gap:4px;}
#bar_chart_race .controls button{appearance:none;display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--ink);cursor:pointer;}
#bar_chart_race .controls button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
#bar_chart_race .controls svg{width:20px;height:20px;}
#bar_chart_race .play svg{fill:currentColor;}
#bar_chart_race .play .pause-symbol,#bar_chart_race .play.playing .play-symbol{display:none;}
#bar_chart_race .play.playing .pause-symbol{display:inline;}
</style>

let previousMax = 0;
function updateAxis(max) {
  if (max === previousMax) return;
  previousMax = max;
  const rough = max / intervals;
  const magnitude = 10 ** Math.floor(Math.log10(rough));
  const multiple = [1,2,2.5,5,10].find(n => n * magnitude >= rough) || 10;
  const stride = multiple * magnitude || max;
  marks.forEach(({tick,line},i) => {
    const value = i * stride;
    tick.hidden = line.hidden = value > max;
    if (tick.hidden) return;
    tick.style.left = line.style.left = (value / max * 100) + '%';
    tick.textContent = value >= 10000 ? compact.format(value) : tickFormat.format(value);
  });
}

function iconSource(src) {
  if (typeof src !== 'string' || src.length > 11000) return Promise.resolve(null);
  if (!icons.has(src)) {
    icons.set(src, new Promise(resolve => {
      const match = /^data:image\/(?:png|jpeg|gif|webp);base64,([A-Za-z0-9+/]+={0,2})$/i.exec(src);
      if (!match || match[1].length % 4) return resolve(null);
      const padding = match[1].endsWith('==') ? 2 : match[1].endsWith('=') ? 1 : 0;
      if (match[1].length * .75 - padding > 8192) return resolve(null);

      image.onerror = () => resolve(null);

  node.icon.removeAttribute('src');
  if (key) iconSource(key).then(src => {
    if (src && node.key === key) { node.icon.src = src; node.icon.hidden = false; }
  });
}

const palette = ['#477fdb','#8393ac','#399774','#ea8141','#d85267','#d9ae46','#579b94','#c5779b','#b95870','#63915f','#6b74be','#6b989e'];
const nodes = new Map();
// Test the outside position even when the tip is currently inset.
const tipObserver = new ResizeObserver(() => {
  const right = plot.getBoundingClientRect().right;
  for (const {bar,tip,icon} of nodes.values()) {
    const outsideEnd = bar.getBoundingClientRect().right + tip.getBoundingClientRect().width;
    tip.classList.toggle('inset', !icon.hidden && outsideEnd > right);
  }
});
tipObserver.observe(plot);
function makeRow(label) {
  const row = document.createElement('div');
  row.className = 'row';
  row.setAttribute('role','listitem');
  row.innerHTML = '<div class="name"><b></b></div><div class="track"><div class="bar"><span class="tip"><img class="icon" alt="" hidden><span class="value"></span></span></div></div>';
  row.querySelector('b').textContent = label;
  const color = palette[identities.get(label) % palette.length];
  row.style.setProperty('--color', color);
  rows.appendChild(row);
  const bar = row.querySelector('.bar'), tip = row.querySelector('.tip');
  tipObserver.observe(bar);
  tipObserver.observe(tip);
  return {row, bar, tip, value:row.querySelector('.value'), icon:row.querySelector('img'), y:capacity};
}

const duration = 500;
let elapsed = 0, playing = false, previous = null, request = 0;
function draw(delta, snap) {
  const position = elapsed / duration, index = Math.min(last, Math.floor(position));
  const t = reduced.matches ? 0 : Math.max(0, (position - index - .2) / .8);
  const next = Math.min(index + 1, last);
  find('.period').textContent = times[t >= .5 ? next : index];

  const values = [];
  for (const item of series) {
    const a = item.values[index], b = item.values[next];
    // In a lowest-first ranking, fading missing values toward zero would give them a false lead.
    if (ascending && (a === null || b === null)) {
      const known = t >= .5 ? b : a;
      if (known !== null) values.push({item, value: known});
      continue;
    }
    if (a === null && (!t || b === null)) continue;
    const start = a ?? 0, end = b ?? 0;
    values.push({item, value: start + (end - start) * t});
  }
  values.sort((a,b) => (ascending ? a.value-b.value : b.value-a.value) || identities.get(a.item.label)-identities.get(b.item.label));
  values.length = Math.min(capacity,values.length);
  const axisMax = values[ascending ? values.length - 1 : 0]?.value || 1;
  updateAxis(axisMax);
  const visible = new Set(values.map(r => r.item.label));
  for (const [label,node] of nodes) {
    if (!visible.has(label)) {
      tipObserver.unobserve(node.bar);
      tipObserver.unobserve(node.tip);
      node.row.remove();
      nodes.delete(label);
    }
  }
  let rank = 0;
  values.forEach(({item,value},i) => {
    if (!i || value !== values[i-1].value) rank = i+1;
    if (!nodes.has(item.label)) nodes.set(item.label,makeRow(item.label));
    const node = nodes.get(item.label);
    node.y = snap || reduced.matches ? i : i + (node.y-i)*Math.exp(-delta/85);
    node.row.style.transform = 'translateY('+(node.y*step).toFixed(2)+'px)';
    node.row.style.zIndex = limit-i;
    node.bar.style.width = (value/axisMax*100)+'%';
    const display = t && Number.isInteger(item.values[index] ?? 0) && Number.isInteger(item.values[next] ?? 0) ? Math.round(value) : value;
    const full = format.format(display);
    node.value.textContent = full.length > 7 ? compact.format(display) : full;
    node.row.title = rank+' · '+item.label+' · '+full+' '+(data.unit || '');
    node.row.setAttribute('aria-label',node.row.title);
    node.row.setAttribute('aria-posinset',i+1);
    node.row.setAttribute('aria-setsize',values.length);
    setIcon(node,item.image);
  });
}
function controls() {
  const focused = document.activeElement;
  const ended = elapsed >= last * duration;
  play.hidden = ended;
  restart.hidden = playing || !last;
  play.classList.toggle('playing',playing);
  play.title = playing ? (en ? 'Pause' : '一時停止') : (en ? 'Play' : '再生');
  play.setAttribute('aria-label',play.title);
  if (focused === play && play.hidden && !restart.hidden) restart.focus();
  if (focused === restart && restart.hidden && !play.hidden) play.focus();
}
function pause() {
  cancelAnimationFrame(request);
  playing = false;
  controls();
}
function tick(now) {
  const delta = previous === null ? 0 : Math.min(now-previous,100);
  previous = now;
  elapsed = Math.min(elapsed+delta,last*duration);
  const done = elapsed >= last*duration;
  draw(delta,done);
  if (done) pause(); else request = requestAnimationFrame(tick);
}
function start(reset) {
  cancelAnimationFrame(request);
  if (reset || elapsed >= last*duration) { elapsed = 0; draw(0,true); }
  previous = null;
  playing = true;
  controls();
  request = requestAnimationFrame(tick);
}
play.onclick = () => playing ? pause() : start(false);
restart.onclick = () => start(true);

draw(0,true);
if (last && !reduced.matches) start(false); else controls();
} catch(error) {
  root.textContent = error.message;
  root.setAttribute('role','alert');
}
})();
</script>
