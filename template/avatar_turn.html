<!-- キャラの一回転。現在のMuseアバターから作った12方向の画像をdataに設定する。 -->
<div id="avatar-turn">
  <button type="button" disabled>
    <span class="sprite" aria-hidden="true"></span>
    <span class="hint">タップすると回転するよ</span>
  </button>
</div>
<style>
#avatar-turn{display:grid;place-items:center;padding:12px}
#avatar-turn button{display:block;width:min(100%,256px);padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
#avatar-turn button:focus{outline:none}
#avatar-turn button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
#avatar-turn .sprite{display:block;width:100%;aspect-ratio:1;background-size:400% 300%;background-repeat:no-repeat}
#avatar-turn .hint{display:block;margin-top:16px;color:#767676;font-size:14px;text-align:center}
#avatar-turn .turning{animation:avatar-turn-cycle 1s steps(1,end) 1}
@keyframes avatar-turn-cycle{
  0%,100%{background-position:0% 0%}
  8.3333%{background-position:33.333333% 0%}
  16.6667%{background-position:66.666667% 0%}
  25%{background-position:100% 0%}
  33.3333%{background-position:0% 50%}
  41.6667%{background-position:33.333333% 50%}
  50%{background-position:66.666667% 50%}
  58.3333%{background-position:100% 50%}
  66.6667%{background-position:0% 100%}
  75%{background-position:33.333333% 100%}
  83.3333%{background-position:66.666667% 100%}
  91.6667%{background-position:100% 100%}
}
</style>

var button = document.querySelector('#avatar-turn button');
var sprite = button.querySelector('.sprite');
if (data.lang === 'en') button.querySelector('.hint').textContent = 'Tap to spin';
var label = data.lang === 'en' ? 'Spin ' + data.name : data.name + 'を一回転させる';
button.setAttribute('aria-label', label);
button.title = label;
function turn(){
  sprite.classList.remove('turning');
  void sprite.offsetWidth;
  sprite.classList.add('turning');
}
// 600,000 bytes fill exactly 800,000 Base64 characters (three bytes per quartet).
var webpPrefix = 'data:image/webp;base64,';
if (typeof data.sheet === 'string' && data.sheet.slice(0, webpPrefix.length).toLowerCase() === webpPrefix &&
    data.sheet.slice(webpPrefix.length).replace(/\s/g, '').length > 600000 / 3 * 4) {
  button.textContent = data.lang === 'en' ? 'Use a WebP image of 600 KB or less.' : 'WebP画像は600 KB以内にしてください';
  return;
}
var image = new Image();
image.onload = function(){
  sprite.style.backgroundImage = 'url("' + image.src + '")';
  button.disabled = false;
  button.onclick = turn;
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) turn();
};
image.onerror = function(){ button.textContent = data.lang === 'en' ? 'Avatar image unavailable' : 'アバター画像を読み込めません'; };
image.src = data.sheet;
})();
