<!-- クイズテンプレート: Duolingo 風の白い画面(高さ 600px 固定)。進行バーと、下に厚みのある立体的なボタン。4択を答え合わせし、最後まで行ったらまちがえた問題をすべて直すまで繰り返し、そのあと結果を表示する。問題(最大10問)・画像・文言はスクリプト冒頭の data と IMAGES で変更できる。 -->
<div id="quiz-w"></div>
<style>
#quiz-w{box-sizing:border-box;width:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%;}
#quiz-w *{box-sizing:border-box;}
#quiz-w button{font:inherit;color:inherit;}

#quiz-w{padding:14px 14px 16px;}
#quiz-w .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
#quiz-w .bar{flex:1;height:14px;border-radius:999px;overflow:hidden;}
#quiz-w .bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .45s cubic-bezier(.3,1.4,.5,1);position:relative;}
#quiz-w .bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);}
#quiz-w .cnt{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
#quiz-w .stk{display:none;}
#quiz-w .q{font-size:17px;font-weight:800;line-height:1.45;margin:0 0 12px;}
#quiz-w .im{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin:0 0 14px;}
#quiz-w .cs{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;margin:6px 0 4px;}
#quiz-w .c{display:inline-flex;align-items:center;gap:6px;max-width:100%;cursor:pointer;font-size:15px;font-weight:700;padding:10px 16px;transition:transform .08s,box-shadow .08s;}
#quiz-w .c .t{min-width:0;}
#quiz-w .c .ic{width:18px;height:18px;flex:none;}
#quiz-w .c:disabled{cursor:default;}
#quiz-w .c.dim{opacity:.45;}
#quiz-w .fb{margin-top:14px;padding:12px 14px;border-radius:14px;animation:qzUp .25s ease-out;}
@keyframes qzUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#quiz-w .fh{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;}
#quiz-w .fh .ic{width:26px;height:26px;}
#quiz-w .fa{margin-top:6px;font-size:14px;}
#quiz-w .fx{margin-top:6px;font-size:13px;line-height:1.6;opacity:.9;}
#quiz-w .go{display:block;width:100%;margin-top:16px;padding:14px;font-size:15px;font-weight:800;letter-spacing:.06em;cursor:pointer;transition:transform .08s,box-shadow .08s;}
#quiz-w .go:disabled{cursor:default;}
#quiz-w .rv{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;margin-bottom:10px;}
#quiz-w .res{text-align:center;animation:qzUp .35s ease-out;}
#quiz-w .tr{display:block;height:116px;width:auto;margin:6px auto 4px;filter:drop-shadow(0 8px 14px rgba(160,110,0,.35));animation:qzPop .6s cubic-bezier(.3,1.6,.5,1);}
@keyframes qzPop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
#quiz-w .res{padding-top:6px;}
#quiz-w .rt{font-size:24px;font-weight:900;}
#quiz-w .rm{font-size:13px;line-height:1.6;margin:6px 0 14px;opacity:.85;}
#quiz-w .sts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
#quiz-w .sts>div{padding:8px 4px 10px;border-radius:14px;}
#quiz-w .sts small{display:block;font-size:10.5px;font-weight:800;}
#quiz-w .sts b{display:block;font-size:20px;font-weight:900;margin-top:2px;}
#quiz-w .rl{list-style:none;margin:14px 0 0;padding:0;text-align:left;}
#quiz-w .rl li{display:flex;align-items:center;gap:10px;padding:9px 4px;font-size:14px;}
#quiz-w .rl .n{font-weight:900;width:28px;}
#quiz-w .rl .a{flex:1;font-weight:700;}
#quiz-w .rl em{font-style:normal;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;}

#quiz-w{height:600px;display:flex;flex-direction:column;overflow:hidden;transition:background .4s;}
#quiz-w .top{flex:none;}
#quiz-w .body{flex:1;min-height:0;display:flex;flex-direction:column;}
#quiz-w .mn{flex:1;min-height:0;display:flex;flex-direction:column;}
#quiz-w .q{flex:none;}
#quiz-w .rv{align-self:flex-start;flex:none;}
#quiz-w .im{flex:1 1 0;min-height:90px;max-height:none;height:0;}
#quiz-w .cs{flex:none;margin-top:auto;padding:12px 0 16px;}
#quiz-w .ft{flex:none;margin:0;padding:0;border-radius:16px;}
#quiz-w .ft.ok,#quiz-w .ft.ng{padding:14px;} #quiz-w .ft.ok{background:#d7ffb8;} #quiz-w .ft.ng{background:#ffdfe0;}
#quiz-w .fb{margin:0 0 12px;padding:0;background:none !important;}
#quiz-w .go{margin-top:0;}
#quiz-w .res{flex:1;min-height:0;overflow-y:auto;}
#quiz-w.fin .bar{background:rgba(255,255,255,.6);}
#quiz-w.fin.perfect{background:linear-gradient(180deg,#fff6cc,#ffe08a);} #quiz-w.fin.perfect .cnt,#quiz-w.fin.perfect .rt{color:#ce8200;}
#quiz-w.fin.oneMiss{background:linear-gradient(180deg,#f0ffe4,#c6f0a4);} #quiz-w.fin.oneMiss .cnt,#quiz-w.fin.oneMiss .rt{color:#58a700;}
#quiz-w.fin.more{background:linear-gradient(180deg,#e6f7ff,#b5e3ff);} #quiz-w.fin.more .cnt,#quiz-w.fin.more .rt{color:#1899d6;}
#quiz-w.fin .sts>div{background:#fff;}
#quiz-w.fin .rl li{border-top-color:rgba(0,0,0,.08);}
#quiz-w .rl li{padding:7px 4px;}
#quiz-w .rl .ck{display:flex;color:#58cc02;} #quiz-w .rl .ck .ic{width:22px;height:22px;}
#quiz-w{background:#fff;color:#3c3c3c;}
#quiz-w .bar{background:#e5e5e5;} #quiz-w .bar i{background:#58cc02;}
#quiz-w .cnt{color:#afafaf;}
#quiz-w .im{border:2px solid #e5e5e5;}
#quiz-w .c{background:#fff;color:#4b4b4b;border:2px solid #e5e5e5;border-radius:14px;box-shadow:0 4px 0 #e5e5e5;}
#quiz-w .c:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 #e5e5e5;}
#quiz-w .c.sel{background:#ddf4ff;border-color:#84d8ff;box-shadow:0 4px 0 #84d8ff;color:#1899d6;}
#quiz-w .c.ok{background:#d7ffb8;border-color:#58cc02;box-shadow:0 4px 0 #58a700;color:#58a700;}
#quiz-w .c.ng{background:#ffdfe0;border-color:#ff4b4b;box-shadow:0 4px 0 #ea2b2b;color:#ea2b2b;}
#quiz-w .fb.ok{background:#d7ffb8;color:#58a700;} #quiz-w .fb.ng{background:#ffdfe0;color:#ea2b2b;}
#quiz-w .fx{color:#4b4b4b;}
#quiz-w .go{border:none;border-radius:16px;background:#58cc02;color:#fff;box-shadow:0 4px 0 #58a700;}
#quiz-w .go:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 #58a700;}
#quiz-w .go:disabled{background:#e5e5e5;color:#afafaf;box-shadow:0 4px 0 #d0d0d0;}
#quiz-w .go.ng{background:#ff4b4b;box-shadow:0 4px 0 #ea2b2b;}
#quiz-w .rv{background:#fff4d6;color:#ce8200;}
#quiz-w .rt{color:#58cc02;}
#quiz-w .sts>div{border:2px solid;} #quiz-w .s1{border-color:#ffc800 !important;color:#ce8200;} #quiz-w .s2{border-color:#58cc02 !important;color:#58a700;} #quiz-w .s3{border-color:#1cb0f6 !important;color:#1899d6;}
#quiz-w .rl li{border-top:2px solid #f0f0f0;}
#quiz-w .rl li.l1 em{background:#d7ffb8;color:#58a700;} #quiz-w .rl li.l2 em{background:#fff4d6;color:#ce8200;}

</style>
<script>
(function(){
var R = document.getElementById("quiz-w");
try {
/* Muse 以外のブラウザでも動くよう、hatchWidget が無ければメモリ上の代替を使う */
var HW = window.hatchWidget || (function(){ var s = null; return { getState: function(d){ return s === null ? d : s; }, setState: function(v){ s = v; } }; })();

/* ===== data: 問題と表示する文言はすべてここで変える ===== */
var data = {
  title: 'いきもの・れきしクイズ',        // string: 見出し
  /* 問題(1〜10問)。上から順に出題する。型:
   *   { text: string, image?: string, choices: [string, string, string, string], answer: number(0〜3), explanation?: string }
   *   image:   下の IMAGES のキー(画像なしの問題は省略)
   *   answer:  正解の選択肢の番号(0 始まり)
   *   explanation: 答え合わせのあとに出す解説(省略可) */
  questions: [
    { text: 'こちらの画像の動物の名前をお答えください。', image: 'raccoon',
      choices: ['たぬき', 'アライグマ', 'レッサーパンダ', 'アナグマ'], answer: 1,
      explanation: 'しま模様のしっぽと、目のまわりの黒い模様が特徴です。たぬきのしっぽには、しま模様がありません。' },
    { text: 'こちらの画像の花の名前をお答えください。', image: 'pansy',
      choices: ['コスモス', 'たんぽぽ', 'チューリップ', 'パンジー'], answer: 3,
      explanation: '丸く重なる大きな花びらと、中心の濃い模様(顔のように見える)が特徴です。' },
    { text: '鎌倉幕府の第3代執権はだれ？',
      choices: ['源頼朝', '源義経', '源実朝', '北条泰時'], answer: 3,
      explanation: '第3代執権は北条泰時。御成敗式目を定めました。源頼朝は初代将軍、源実朝は第3代将軍です。' }
  ],
  text: {                                  // 画面の文言
    check: 'OK', next: 'つぎへ', toReview: 'まちがえた問題へ', finish: '結果を見る',
    correct: '正解!', wrong: '不正解', answerIs: '正解',
    review: 'まちがえた問題をもう一度', streak: '連続正解',
    firstTry: '1回目で正解', rate: '正答率', reviewed: '復習した問題',
    okFirst: '一発正解', okReview: '復習で正解'
  },
  /* 結果画面の見出しとひとこと。1回目でまちがえた数で、3つのうちどれを出すかが決まる。
   * 型: { title: string, message: string }
   * 見出しは自由に書く。例) 全問正解: '全問正解!' '天才では?'  1問: 'おしい!' 'もう一息!'  2問以上: 'がんばったね!' 'これからだ!' */
  result: {
    perfect: { title: '全問正解!',      message: '全問、1回目で正解しました。' },                     // まちがい 0問
    oneMiss: { title: 'おしい!',        message: 'まちがえた1問も、しっかり直せました。' },           // まちがい 1問
    more:    { title: 'がんばったね!',  message: 'まちがえた問題も、すべて直せました。' }             // まちがい 2問以上
  }
};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* ---- 進行状態(保存される)。問題の数が変わったら最初から ---- */
var QS = data.questions, N = QS.length, T = data.text;
function fresh(){ var q = [], i; for (i = 0; i < N; i++) q.push(i); return { n: N, round: 0, queue: q, pos: 0, sel: -1, chk: false, miss: [], first: [], done: [], streak: 0, fin: false }; }
var st = HW.getState(null);
if (!st || st.n !== N || !st.queue) st = fresh();
function save(){ try { HW.setState(st); } catch (e) {} }
function icon(ok){
  return ok ? '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="currentColor"/><path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            : '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="currentColor"/><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>';
}
var FLAME = '<svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5 1-1 1-3 0-9z" fill="currentColor"/></svg>';

R.innerHTML = '<div class="top"><div class="bar"><i></i></div><span class="stk"></span><span class="cnt"></span></div><div class="body"></div>';
var body = R.querySelector('.body');

function render(){
  R.querySelector('.bar i').style.width = (st.done.length / N * 100) + '%';
  R.querySelector('.cnt').textContent = st.done.length + '/' + N;
  var sk = R.querySelector('.stk'); sk.innerHTML = st.streak >= 2 ? FLAME + '<b>' + st.streak + '</b>' : ''; sk.title = T.streak;
  R.classList.toggle('fin', !!st.fin);
  if (st.fin) return result();
  var qi = st.queue[st.pos], q = QS[qi], ok = st.chk && st.sel === q.answer, last = st.pos === st.queue.length - 1;
  var h = '<div class="mn">';
  if (st.round > 0) h += '<div class="rv">' + esc(T.review) + ' <span>' + (st.pos + 1) + '/' + st.queue.length + '</span></div>';
  h += '<div class="q">' + esc(q.text) + '</div>';
  if (q.image && IMAGES[q.image]) h += '<img class="im" alt="" src="' + IMAGES[q.image] + '">';
  h += '<div class="cs">' + q.choices.map(function(c, i){
    var cls = 'c';
    if (st.chk) cls += i === q.answer ? ' ok' : i === st.sel ? ' ng' : ' dim';
    else if (i === st.sel) cls += ' sel';
    return '<button type="button" class="' + cls + '" data-i="' + i + '"' + (st.chk ? ' disabled' : '') + '><span class="t">' + esc(c) + '</span>' + (st.chk && (i === q.answer || i === st.sel) ? icon(i === q.answer) : '') + '</button>';
  }).join('') + '</div></div>';
  h += '<div class="ft' + (st.chk ? (ok ? ' ok' : ' ng') : '') + '">';
  if (st.chk) h += '<div class="fb ' + (ok ? 'ok' : 'ng') + '"><div class="fh">' + icon(ok) + '<b>' + esc(ok ? T.correct : T.wrong) + '</b></div>' +
    (ok ? '' : '<div class="fa">' + esc(T.answerIs) + ': <b>' + esc(q.choices[q.answer]) + '</b></div>') +
    (q.explanation ? '<div class="fx">' + esc(q.explanation) + '</div>' : '') + '</div>';
  var label = !st.chk ? T.check : !last ? T.next : (st.miss.length ? T.toReview : T.finish);
  h += '<button type="button" class="go' + (st.chk ? (ok ? ' ok' : ' ng') : '') + '"' + (!st.chk && st.sel < 0 ? ' disabled' : '') + '>' + esc(label) + '</button>';
  h += '</div>';
  body.innerHTML = h;
  body.querySelectorAll('.c').forEach(function(b){ b.onclick = function(){ if (st.chk) return; st.sel = +b.dataset.i; save(); render(); }; });
  body.querySelector('.go').onclick = function(){
    if (!st.chk) {
      if (st.sel < 0) return;
      st.chk = true;
      if (st.sel === q.answer) { if (st.done.indexOf(qi) < 0) st.done.push(qi); st.streak++; }
      else { st.miss.push(qi); if (st.round === 0) st.first.push(qi); st.streak = 0; }
    } else {
      st.pos++; st.sel = -1; st.chk = false;
      if (st.pos >= st.queue.length) {
        if (st.miss.length) { st.round++; st.queue = st.miss; st.miss = []; st.pos = 0; }   // まちがえた問題をもう一度
        else st.fin = true;                                                                 // すべて直したら結果へ
      }
    }
    save(); render();
  };
}

function result(){
  var firstOk = N - st.first.length, pct = Math.round(firstOk / N * 100);
  var key = st.first.length === 0 ? 'perfect' : st.first.length === 1 ? 'oneMiss' : 'more', tier = data.result[key];
  R.classList.remove('perfect', 'oneMiss', 'more'); R.classList.add(key);
  body.innerHTML = '<div class="res">' + (key === 'perfect' ? '<img class="tr" alt="" src="' + TROPHY_IMG + '">' : '') + '<div class="rt">' + esc(tier.title) + '</div><div class="rm">' + esc(tier.message) + '</div>' +
    '<div class="sts"><div class="s1"><small>' + esc(T.firstTry) + '</small><b>' + firstOk + '/' + N + '</b></div><div class="s2"><small>' + esc(T.rate) + '</small><b>' + pct + '%</b></div><div class="s3"><small>' + esc(T.reviewed) + '</small><b>' + st.first.length + '問</b></div></div>' +
    '<ul class="rl">' + QS.map(function(q, i){ var f = st.first.indexOf(i) < 0;
      return '<li class="' + (f ? 'l1' : 'l2') + '"><span class="n">Q' + (i + 1) + '</span><span class="a">' + esc(q.choices[q.answer]) + '</span>' + (f ? '<span class="ck" title="' + esc(T.okFirst) + '">' + icon(true) + '</span>' : '<em>' + esc(T.okReview) + '</em>') + '</li>'; }).join('') + '</ul></div>';
}

/* ===== 画像(Base64 の data URI)。questions[].image にキーを書く =====
 * 1枚 40KB まで(6枚以上使うときは 20KB まで)、縦横 640px まで。WebP / JPEG を推奨。 */
