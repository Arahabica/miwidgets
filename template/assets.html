<!-- 株価チャートテンプレート: 保有銘柄ごとの損益(円)の日次推移を表示する。前日比を大きく、通算損益を補助として見せ、折れ線チャートと銘柄別の凡例(スパークライン・前日比・損益。前日比の大きい順)付き。Muse のテーマに追従する背景なしのデザイン。表示内容・色・レイアウトはすべてスクリプト冒頭の data で変更できる。 -->
<div id="assets-w" style="min-height:420px;">
<div class="head"></div>
<svg class="chart" viewBox="0 0 360 200"></svg>
<div class="lgbox"><div class="legend"></div><div class="panel" style="display:none;"></div></div>
<style>
#assets-w .lgbox{display:grid;}
#assets-w .legend,#assets-w .panel{grid-area:1/1;}
#assets-w .chart{width:100%;display:block;touch-action:manipulation;aspect-ratio:360/200;}
#assets-w .ln{transition:opacity .15s;}
#assets-w .draw-line{animation:assetsDraw .7s ease-out both;}
#assets-w .end-dot{animation:assetsAppear .2s ease-out .7s both;}
@keyframes assetsDraw{from{stroke-dasharray:1;stroke-dashoffset:1;}to{stroke-dasharray:1;stroke-dashoffset:0;}}
@keyframes assetsAppear{from{opacity:0;}to{opacity:1;}}
@media (prefers-reduced-motion:reduce){#assets-w .draw-line,#assets-w .end-dot{animation:none;}}
#assets-w .lg{cursor:pointer;font:inherit;text-align:left;min-width:0;}
#assets-w .lg .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
#assets-w .panel{position:relative;align-self:start;min-width:0;background:var(--w-panel-bg);color:var(--w-panel-text);border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.35);padding:10px 12px;z-index:2;}
#assets-w .panel .prow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px 12px;font-size:11px;margin-top:2px;}
#assets-w .panel .pi{display:flex;align-items:center;gap:4px;min-width:0;line-height:1.7;padding:1px 0;}
#assets-w .panel .pi .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#assets-w .panel .pi .vl{margin-left:auto;font-weight:600;flex:none;}

#assets-w{box-sizing:border-box;width:100%;padding:12px 12px 10px;color:var(--hatch-widget-text,#1c1c1e);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;--bd:var(--hatch-widget-border,#d1d1d6);--mut:var(--hatch-widget-muted,#6e6e73);}
#assets-w .hc{padding:13px 15px 4px;}
#assets-w .hr{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);}
#assets-w .hr b{color:var(--hatch-widget-text,#1c1c1e);}
#assets-w .big{font-size:36px;font-weight:700;line-height:1.1;letter-spacing:-.03em;margin-top:4px;}
#assets-w .big small{font-size:14px;font-weight:700;margin-left:8px;letter-spacing:0;}
#assets-w .chart{margin-top:10px;}
#assets-w .lgbox{margin-top:6px;}
#assets-w .lg{display:grid;grid-template-columns:8px minmax(0,1fr) 64px 100px;align-items:center;gap:10px;width:100%;padding:9px 4px;border:none;border-top:1px solid var(--bd);background:none;color:inherit;font-size:12.5px;}
#assets-w .lg:first-child{border-top:none;}
#assets-w .lg .sw{width:8px;height:8px;border-radius:50%;}
#assets-w .lg .vr{text-align:right;line-height:1.25;}
#assets-w .lg .vl{display:block;font-weight:700;font-size:13px;}
#assets-w .lg .dc{display:block;white-space:nowrap;font-size:10.5px;color:var(--mut);}
#assets-w .lg .dc b{font-weight:600;}
</style>
<script>
(function(){
try {
/* ============================================================
 * data: 変更しうる値はすべてここに集約。描画ロジックは data だけを参照して生成する。
 * ============================================================ */
var data = {
  /* ---- 表示テキスト -------------------------------------------
   * 型: { [キー]: string } ・すべて必須
   */
  text: {
    totalLabel: '通算損益',                  // string: ヘッダーの合計ラベル
    dayChangeLabel: '前日比',                // string: ヘッダーの前日比ラベル
    panelTotalLabel: '合計損益',             // string: パネル内の合計ラベル
    asOfSuffix: '時点',                      // string: パネル見出しの日付の後ろに付く語
    noData: 'この時点のデータはありません',  // string: 選択銘柄に値がない日のメッセージ
    unitYen: '円',                           // string: 金額の単位
    unitMan: '万'                            // string: 凡例・Y軸の単位(1万=10000円)
  },

  /* ---- 色 -----------------------------------------------------
   * 型: { [キー]: string(CSSの色: '#rrggbb' など) } ・すべて必須(※ gradUp/gradDown のみ string[2])
   *   本体の色は CSS 側(<style>)でも指定している。ここは JavaScript が描画する部分の色
   */
  colors: {
    up: '#12a150',          // 利益(ヘッダー・凡例)
    down: '#e5484d',        // 損失
    muted: 'var(--hatch-widget-muted,#6e6e73)',   // 軸ラベル・補助文字
    grid: 'var(--hatch-widget-border,#d1d1d6)',   // グリッド線
    zero: 'var(--hatch-widget-muted,#6e6e73)',    // 0 の基準線
    panelUp: '#12a150',     // 利益(パネル内)
    panelDown: '#e5484d',   // 損失(パネル内)
    panelBg: '#ffffff',     // パネル背景
    panelText: '#1c1c1e',   // パネル文字
    panelMuted: '#6e6e73',  // パネルの補助文字
    panelZeroLine: '#c7c7cc', // ミニチャートの0ライン
    dotStroke: '#ffffff'    // 選択点の縁
  },

  /* ---- ヘッダー(サマリー) -------------------------------------
   * 型: { returnPct: number, dayChange: number }
   * 通算損益(金額)は totals の末尾から自動表示。
   * ※ 手入力。totals / items の値と食い違わないよう注意。
   */
  summary: {
    returnPct: 1.6,      // number: 通算損益率(%)。例: 1.2 → (+1.2%)
    dayChange: 9800      // number: 前日比(円)。負で赤、正で緑
  },

  /* ---- チャートのレイアウト・スケール --------------------------
   * 型: { [キー]: number } ・すべて必須。座標は viewBox(width × height)基準
   */
  chart: {
    width: 360, height: 200,    // number: viewBox のサイズ
    left: 36, right: 342,       // number: プロット領域のX範囲(left < right)
    top: 10, bottom: 180,       // number: プロット領域のY範囲(top < bottom)
    xLabelY: 195,               // number: X軸ラベルのY位置
    xLabelStep: 2,              // number(整数>=1): X軸ラベルを何点おきに出すか(先頭と末尾は常に表示)
    yTickStep: 10000,           // number(>0): Y軸目盛り間隔(円)。データの幅に合わせて調整
    yPadRatio: 0.07,            // number(>=0): データ範囲の上下余白(比率)
    lineWidth: 2,             // number: 折れ線の太さ
    endDotR: 2.4,               // number: 折れ線の末尾の点の半径
    guideDotR: 2.6,             // number: 日付選択時の点の半径
    fontSize: 8,                // number: 軸ラベルの文字サイズ
    smooth: false,              // boolean: 折れ線を滑らかな曲線にするか(false で直線)
    haloR: 0                    // number: 折れ線の末尾の点の外側のにじみの半径(0 でなし)
  },

  /* ---- 銘柄別ミニチャート(パネル内) ---------------------------
   * 型: { [キー]: number } ・すべて必須
   */
  mini: {
    width: 300, height: 72,     // number: viewBox のサイズ
    padX: 8, padY: 6,           // number: 内側の余白
    lineWidth: 1.8,             // number: 折れ線の太さ
    endDotR: 2.2,               // number: 末尾の点の半径
    selDotR: 3.2                // number: 選択日の点の半径
  },

  /* ---- 日付(X軸) ----------------------------------------------
   * 型: string[]  ・1件以上(2件以上推奨)
   * 日付の間隔に関係なく等間隔で配置される。表示文字列をそのまま出す。
   * items[].pnl と totals は、この配列と同じ長さにする。
   */
  dates: ['11/10', '11/11', '11/12', '11/13', '11/16'],

  /* ---- 合計損益(日付ごと) -------------------------------------
   * 型: number[]  ・単位は円 ・長さは dates と同じ
   * ※ 手入力。各銘柄の pnl の合計と一致させる。
   * ※ 説明用の架空データ
   */
  totals: [0, 19500, -13900, 38100, 47900],

  /* ---- 銘柄ごとの損益推移 -------------------------------------
   * 型: { name: string, color: string, pnl: (number|null)[] }[]
   *   name:  凡例・パネルに出す銘柄名
   *   color: 折れ線・凡例の色(CSSの色)
   *   pnl:   日付ごとの損益(円)。長さは dates と同じ。
   *          その日のデータがなければ null(線はその点を飛ばす)
   * 1銘柄以上。pnl に数値が1つも無い銘柄は不可。
   * 凡例の値は、各銘柄の最後の数値(null以外)を自動表示。
   * ※ 説明用の架空データ(実際の株価ではない)
   */
  items: [
    { name: 'オルカン',   color: '#3a5ad1', pnl: [0, 8000, -6000, 16000, 22000] },
    { name: '日経平均',   color: '#e8890c', pnl: [0, 2700, -1800, 4500, 6300] },
    { name: 'Nvidia',     color: '#12a150', pnl: [0, 11200, -7600, 14000, 20800] },
    { name: 'Apple',      color: '#9b51e0', pnl: [0, -2400, 1500, 3600, -1200] }
  ]
};

var R = document.getElementById('assets-w');
function q(s){ return R.querySelector(s); }
function qa(s){ return R.querySelectorAll(s); }
var T = data.text, C = data.colors, CH = data.chart, MI = data.mini;

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function sign(v){ return v > 0 ? '+' : ''; }
function fmt(v){ return sign(v) + v.toLocaleString('ja-JP') + T.unitYen; }
function fmtMan(v){ return sign(v) + (v / 10000).toFixed(1) + T.unitMan; }
function fmtTick(v){ return v === 0 ? '0' + T.unitMan : sign(v) + (v / 10000) + T.unitMan; }
function colHead(v){ return v < 0 ? C.down : C.up; }
function colPanel(v){ return v < 0 ? C.panelDown : C.panelUp; }
function last(arr){ return arr[arr.length - 1]; }
function r1(n){ return n.toFixed(1); }

/* ---- 派生値(座標・スケール・銘柄ごとの最終損益) ---- */
var N = data.dates.length;
var xs = data.dates.map(function(_, j){ return CH.left + j * ((CH.right - CH.left) / (N - 1)); });
var all = [];
data.items.forEach(function(it){ it.pnl.forEach(function(v){ if (v !== null) all.push(v); }); });
var dMin = Math.min.apply(null, all), dMax = Math.max.apply(null, all);
var pad = (dMax - dMin) * CH.yPadRatio;
var lo = dMin - pad, hi = dMax + pad;
function Y(v){ return CH.top + (hi - v) * ((CH.bottom - CH.top) / (hi - lo)); }
data.items.forEach(function(it){
  it.ys = it.pnl.map(function(v){ return v === null ? null : Y(v); });
  it.total = last(it.pnl.filter(function(v){ return v !== null; }));
});

/* ---- 折れ線(nullで途切れる。smooth=true で滑らかな曲線) ---- */
function runs(ys){
  var out = [], cur = [];
  ys.forEach(function(y, j){
    if (y === null) { if (cur.length) out.push(cur); cur = []; } else cur.push([xs[j], y]);
  });
  if (cur.length) out.push(cur);
  return out;
}
function pathOf(P){
  if (!P.length) return '';
  var d = 'M' + r1(P[0][0]) + ',' + r1(P[0][1]), n = P.length, i;
  if (!CH.smooth || n < 3) {
    for (i = 1; i < n; i++) d += ' L' + r1(P[i][0]) + ',' + r1(P[i][1]);
    return d;
  }
  /* 単調性を保つ3次補間(Fritsch-Carlson)。点の間で行き過ぎず、山や谷が自然に出る */
  var dx = [], m = [], t = [];
  for (i = 0; i < n - 1; i++) { dx[i] = P[i+1][0] - P[i][0]; m[i] = (P[i+1][1] - P[i][1]) / dx[i]; }
  t[0] = m[0]; t[n-1] = m[n-2];
  for (i = 1; i < n - 1; i++) t[i] = (m[i-1] * m[i] <= 0) ? 0 : (m[i-1] + m[i]) / 2;
  for (i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i+1] = 0; continue; }
    var a = t[i] / m[i], b = t[i+1] / m[i], s2 = a * a + b * b;
    if (s2 > 9) { var tau = 3 / Math.sqrt(s2); t[i] = tau * a * m[i]; t[i+1] = tau * b * m[i]; }
  }
  for (i = 0; i < n - 1; i++) {
    d += ' C' + r1(P[i][0] + dx[i] / 3) + ',' + r1(P[i][1] + t[i] * dx[i] / 3) + ' ' + r1(P[i+1][0] - dx[i] / 3) + ',' + r1(P[i+1][1] - t[i+1] * dx[i] / 3) + ' ' + r1(P[i+1][0]) + ',' + r1(P[i+1][1]);
  }
  return d;
}

/* 選択日までと、その後の線を分ける。元の曲線の制御点は変えない。 */
function splitTimeline(pointRuns, cutX){
  var past = [], future = [];
  pointRuns.forEach(function(points){
    var d = pathOf(points);
    if (cutX === null) { past.push(d); return; }
    var split = points.findIndex(function(p){ return p[0] > cutX; });
    if (split < 0) { past.push(d); return; }
    if (split === 0) { future.push(d); return; }
    var commands = d.match(/[MLC][^MLC]*/g);
    past.push(commands.slice(0, split).join(''));
    var p = points[split - 1];
    future.push('M' + r1(p[0]) + ',' + r1(p[1]) + commands.slice(split).join(''));
  });
  return {past: past.join(' '), future: future.join(' ')};
}
function timelineHtml(pointRuns, cutX, color, width){
  var paths = splitTimeline(pointRuns, cutX);
  function line(part, opacity){
    return '<path class="draw-line ' + part + '-line" pathLength="1" d="' + paths[part] + '" fill="none" stroke="' + color + '" stroke-width="' + width + '" stroke-linecap="round" stroke-linejoin="round" opacity="' + opacity + '"/>';
  }
  return line('past', 1) + line('future', .25);
}
function updateTimeline(container, pointRuns, cutX){
  var paths = splitTimeline(pointRuns, cutX);
  container.querySelector('.past-line').setAttribute('d', paths.past);
  container.querySelector('.future-line').setAttribute('d', paths.future);
  var tail = container.querySelector('.tail');
  tail.setAttribute('opacity', cutX !== null && +tail.dataset.x > cutX ? '.25' : '1');
}

/* ---- メインチャート(全案共通。見た目は data.chart / data.colors と CSS で変える) ---- */
function buildChart(){
  var svg = q('.chart');
  svg.setAttribute('viewBox', '0 0 ' + CH.width + ' ' + CH.height);
  var s = '', fs = CH.fontSize;
  for (var t = Math.ceil(lo / CH.yTickStep) * CH.yTickStep; t <= hi; t += CH.yTickStep) {
    var zero = (t === 0);
    s += '<line x1="' + CH.left + '" y1="' + r1(Y(t)) + '" x2="' + CH.right + '" y2="' + r1(Y(t)) + '" stroke="' + (zero ? C.zero : C.grid) + '" stroke-width="' + (zero ? 1.2 : 0.6) + '"' + (zero ? ' stroke-dasharray="3 3"' : '') + '/>';
    s += '<text x="' + (CH.left - 4) + '" y="' + r1(Y(t) + 3) + '" font-size="' + fs + '" text-anchor="end" fill="' + C.muted + '">' + fmtTick(t) + '</text>';
  }
  data.items.forEach(function(it, i){
    var rs = runs(it.ys), p = last(last(rs));
    it.chartRuns = rs;
    s += '<g class="ln" data-i="' + i + '" style="color:' + it.color + '">';
    s += timelineHtml(rs, null, it.color, CH.lineWidth);
    s += '<g class="tail" data-x="' + p[0] + '">';
    if (CH.haloR > 0) s += '<circle cx="' + r1(p[0]) + '" cy="' + r1(p[1]) + '" r="' + CH.haloR + '" fill="' + it.color + '" fill-opacity=".25"/>';
    s += '<circle class="end-dot" cx="' + r1(p[0]) + '" cy="' + r1(p[1]) + '" r="' + CH.endDotR + '" fill="' + it.color + '"/></g></g>';
  });
  s += '<line class="guide" y1="' + CH.top + '" y2="' + CH.bottom + '" stroke="' + C.muted + '" stroke-width="1" stroke-dasharray="2 2" style="display:none;"/><g class="dots"></g>';
  data.dates.forEach(function(dt, j){
    if (j % CH.xLabelStep !== 0 && j !== N - 1) return;
    var anchor = j === 0 ? 'start' : (j === N - 1 ? 'end' : 'middle');
    s += '<text x="' + r1(xs[j]) + '" y="' + CH.xLabelY + '" font-size="' + fs + '" text-anchor="' + anchor + '" fill="' + C.muted + '">' + esc(dt) + '</text>';
  });
  s += '<rect x="' + CH.left + '" y="0" width="' + (CH.right - CH.left) + '" height="' + CH.bottom + '" fill="transparent"/>';
  svg.innerHTML = s;
}

/* ---- パネル内ミニチャート ---- */
function miniChart(it, dj){
  var pts = [];
  it.pnl.forEach(function(v, j){ if (v !== null) pts.push([j, v]); });
  if (!pts.length) return '';
  var mn = Math.min.apply(null, pts.map(function(p){ return p[1]; }));
  var mx = Math.max.apply(null, pts.map(function(p){ return p[1]; }));
  var p2 = (mx - mn) * 0.15 || 1000, l = mn - p2, h = mx + p2;
  var w = MI.width - MI.padX * 2, ph = MI.height - MI.padY * 2 - 2;
  function X(j){ return MI.padX + j * (w / (N - 1)); }
  function Ym(v){ return MI.padY + (h - v) * (ph / (h - l)); }
  var points = pts.map(function(p){ return [X(p[0]), Ym(p[1])]; });
  var s = '<svg viewBox="0 0 ' + MI.width + ' ' + MI.height + '" style="width:100%;display:block;margin-top:4px;">';
  if (l < 0 && h > 0) s += '<line x1="' + MI.padX + '" y1="' + r1(Ym(0)) + '" x2="' + (MI.width - MI.padX) + '" y2="' + r1(Ym(0)) + '" stroke="' + C.panelZeroLine + '" stroke-width="0.8" stroke-dasharray="3 3"/>';
  s += timelineHtml([points], X(dj), it.color, MI.lineWidth);
  var lp = last(pts);
  s += '<g opacity="' + (lp[0] > dj ? '.25' : '1') + '"><circle class="end-dot" cx="' + r1(X(lp[0])) + '" cy="' + r1(Ym(lp[1])) + '" r="' + MI.endDotR + '" fill="' + it.color + '"/></g>';
  if (it.pnl[dj] !== null) s += '<circle class="end-dot" cx="' + r1(X(dj)) + '" cy="' + r1(Ym(it.pnl[dj])) + '" r="' + MI.selDotR + '" fill="' + it.color + '" stroke="' + C.dotStroke + '" stroke-width="1.2"/>';
  return s + '</svg>';
}

/* ---- 銘柄ごとのスパークライン(凡例用) ---- */
function sparkline(it, w, h, sw){
  var vs = it.pnl, mn = Infinity, mx = -Infinity;
  vs.forEach(function(v){ if (v !== null) { mn = Math.min(mn, v); mx = Math.max(mx, v); } });
  var span = (mx - mn) || 1, pts = [];
  vs.forEach(function(v, j){ if (v !== null) pts.push([2 + j * ((w - 4) / (N - 1)), 2 + (mx - v) * ((h - 4) / span)]); });
  it.sparkPoints = pts;
  var p = last(pts);
  return '<svg class="sp" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" style="display:block;overflow:visible">' + timelineHtml([pts], null, it.color, sw) + '<g class="tail" data-x="' + p[0] + '"><circle class="end-dot" cx="' + r1(p[0]) + '" cy="' + r1(p[1]) + '" r="' + (sw + 0.6) + '" fill="' + it.color + '"/></g></svg>';
}

/* ---- パネルの中身(HTML文字列) ---- */
function panelHtml(sel, dj){
  var asOf = esc(data.dates[dj]) + esc(T.asOfSuffix);
  if (sel >= 0) {
    var it = data.items[sel], v = it.pnl[dj];
    var body = (v === null)
      ? '<div style="font-size:12px;color:' + C.panelMuted + ';">' + esc(T.noData) + '</div>'
      : '<div style="display:flex;align-items:center;gap:6px;"><span style="width:12px;height:4px;border-radius:2px;background:' + it.color + ';flex:none;"></span><span style="font-size:13px;font-weight:700;">' + esc(it.name) + '</span><span style="margin-left:auto;font-size:16px;font-weight:700;color:' + colPanel(v) + '">' + fmt(v) + '</span></div>';
    return '<div style="font-size:12px;font-weight:700;margin-bottom:4px;">' + asOf + '</div>' + body + miniChart(it, dj);
  }
  var rows = '';
  data.items.forEach(function(it){
    var v = it.pnl[dj];
    if (v === null) return;
    rows += '<div class="pi"><span style="width:10px;height:3px;border-radius:2px;background:' + it.color + ';flex:none;"></span><span class="nm">' + esc(it.name) + '</span><span class="vl" style="color:' + colPanel(v) + '">' + fmt(v) + '</span></div>';
  });
  var tv = data.totals[dj];
  return '<div style="display:flex;align-items:baseline;gap:8px;"><span style="font-size:12px;font-weight:700;">' + asOf + '</span><span style="font-size:11px;color:' + C.panelMuted + ';">' + esc(T.panelTotalLabel) + '</span><span style="font-size:15px;font-weight:700;color:' + colPanel(tv) + '">' + fmt(tv) + '</span></div><div class="prow">' + rows + '</div>';
}

function buildHead(){
  var total = last(data.totals), pct = data.summary.returnPct, dc = data.summary.dayChange;
  R.style.setProperty('--tone', colHead(dc));
  q('.head').innerHTML = '<div class="hc">' +
    '<div class="hr"><span>' + esc(T.dayChangeLabel) + '</span><span>' + esc(T.totalLabel) + ' <b style="color:' + colHead(total) + '">' + fmt(total) + ' (' + sign(pct) + pct + '%)</b></span></div>' +
    '<div class="big" style="color:' + colHead(dc) + '">' + fmt(dc) + '</div></div>';
}

/* 銘柄の前日比: 最後の2つの値(null は飛ばす)の差。2つ無ければ null */
function dayDiff(it){
  var v = it.pnl.filter(function(x){ return x !== null; });
  return v.length < 2 ? null : v[v.length - 1] - v[v.length - 2];
}

function buildLegend(){
  /* 前日比の大きい順(前日比なしは末尾)。data-i は元の items の添字のまま */
  var order = data.items.map(function(it, i){ return i; });
  order.sort(function(a, b){
    var da = dayDiff(data.items[a]), db = dayDiff(data.items[b]);
    if (da === null || db === null) return da === db ? a - b : (da === null ? 1 : -1);
    return db - da || a - b;
  });
  q('.legend').innerHTML = order.map(function(i){
    var it = data.items[i];
    var d = dayDiff(it), tc = colHead(it.total);
    var main = d === null
      ? '<span class="vl" style="color:' + tc + '">' + fmtMan(it.total) + '</span>'
      : '<span class="vl" style="color:' + colHead(d) + '">' + fmtMan(d) + '</span><span class="dc">' + esc(T.totalLabel) + ' <b style="color:' + tc + '">' + fmtMan(it.total) + '</b></span>';
    return '<button class="lg" data-i="' + i + '"><i class="sw" style="background:' + it.color + '"></i><span class="nm">' + esc(it.name) + '</span>' + sparkline(it, 64, 20, 1.8) + '<span class="vr">' + main + '</span></button>';
  }).join('');
}

/* ---- 状態と再描画 ---- */
if (!window.hatchWidget) {
  var memState = null;
  window.hatchWidget = { getState: function(d){ return memState || d; }, setState: function(s){ memState = s; } };
}
var st = window.hatchWidget.getState({sel:-1, date:-1});

function render(){
  var sel = st.sel, dj = st.date;
  qa('.chart .ln').forEach(function(el){
    el.style.opacity = (sel < 0 || +el.dataset.i === sel) ? '1' : '0.12';
    updateTimeline(el, data.items[+el.dataset.i].chartRuns, dj < 0 ? null : xs[dj]);
  });
  qa('.lg').forEach(function(b){
    b.style.opacity = (sel < 0 || +b.dataset.i === sel) ? '1' : '0.45';
    b.style.fontWeight = (+b.dataset.i === sel) ? '700' : '';
    updateTimeline(b.querySelector('.sp'), [data.items[+b.dataset.i].sparkPoints], dj < 0 ? null : 2 + dj * (60 / (N - 1)));
  });
  var guide = q('.guide'), dots = q('.dots'), panel = q('.panel');
  if (dj < 0) { guide.style.display = 'none'; dots.innerHTML = ''; panel.style.display = 'none'; return; }
  guide.setAttribute('x1', xs[dj]); guide.setAttribute('x2', xs[dj]); guide.style.display = '';
  var dh = '';
  data.items.forEach(function(it){
    var y = it.ys[dj];
    if (y === null) return;
    dh += '<circle cx="' + xs[dj] + '" cy="' + y + '" r="' + CH.guideDotR + '" fill="' + it.color + '" stroke="' + C.dotStroke + '" stroke-width="0.8"/>';
  });
  dots.innerHTML = dh;
  panel.innerHTML = panelHtml(sel, dj);
  panel.style.display = '';
}

function set(next){ st = next; window.hatchWidget.setState(st); render(); }

/* ---- 初期化 ---- */
R.style.setProperty('--w-panel-bg', C.panelBg);
R.style.setProperty('--w-panel-text', C.panelText);
buildHead(); buildChart(); buildLegend();

qa('.lg').forEach(function(b){
  b.addEventListener('click', function(){
    var i = +b.dataset.i;
    set({sel: (st.sel === i ? -1 : i), date: st.date});
  });
});
q('.chart').addEventListener('click', function(e){
  var r = e.currentTarget.getBoundingClientRect();
  var x = (e.clientX - r.left) * (CH.width / r.width);
  var best = 0, bd = 1e9;
  xs.forEach(function(xv, j){ var dd = Math.abs(xv - x); if (dd < bd) { bd = dd; best = j; } });
  set({sel: st.sel, date: (st.date === best ? -1 : best)});
});
R.addEventListener('click', function(e){
  if (e.target.closest('.lg') || e.target.closest('.chart') || e.target.closest('.panel')) return;
  if (st.sel >= 0 || st.date >= 0) set({sel: -1, date: -1});
});
window.addEventListener('hatch-widget-state', function(e){ st = e.detail.state; render(); });
render();

} catch (err) {
  var rt = document.getElementById('assets-w'); rt.insertAdjacentHTML('afterbegin','<pre style="white-space:pre-wrap;color:#f66;font-size:11px;">ERROR: '+String(err && err.stack || err).replace(/</g,'&lt;')+'</pre>');
}
})();
</script>
</div>
