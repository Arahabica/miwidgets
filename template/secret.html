<!-- 秘密のメッセージ テンプレート: 金庫のような金属調の画面に、ダイヤルと、緑に光るパスコード欄、金属の数字キー。正しいパスコードでダイヤルが回って開き、メッセージが現れる。「閉じる」でロック画面に戻る。パスコード・メッセージ(テキスト/画像/両方)はスクリプト冒頭の data と IMAGES で変更できる。 -->
<div id="secret-w"></div>
<style>
#secret-w{box-sizing:border-box;width:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%;}
#secret-w *{box-sizing:border-box;}
#secret-w button{font:inherit;color:inherit;}

#secret-w{padding:22px 16px 18px;text-align:center;outline:none;}
#secret-w .ti{font-size:20px;font-weight:800;margin-top:10px;letter-spacing:.04em;}
#secret-w .pr{font-size:13px;margin-top:4px;opacity:.8;}
#secret-w .code{position:relative;display:flex;justify-content:center;gap:8px;margin:18px auto 0;width:max-content;cursor:pointer;}
#secret-w .hid{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;padding:0;margin:0;font-size:16px;color:transparent;caret-color:transparent;background:transparent;cursor:pointer;}
#secret-w .d{width:40px;height:50px;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s,box-shadow .15s;}
#secret-w .d i{width:12px;height:12px;border-radius:50%;animation:scPop .18s ease-out;}
@keyframes scPop{from{transform:scale(0)}to{transform:none}}
#secret-w .code.ng{animation:scShake .45s;}
@keyframes scShake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
#secret-w .err{min-height:20px;margin-top:10px;font-size:12.5px;}
#secret-w .ms{text-align:left;}
#secret-w .ms.in{animation:scIn .6s cubic-bezier(.2,.8,.2,1);}
@keyframes scIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
#secret-w .mt{font-size:20px;font-weight:800;line-height:1.4;}
#secret-w .mp{margin-top:12px;}
#secret-w .mi{display:block;width:100%;height:auto;}
#secret-w .mx{margin-top:12px;font-size:14px;line-height:1.85;}
#secret-w .mf{margin-top:12px;text-align:right;font-size:13px;}

#secret-w{color:#e7edf3;background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),linear-gradient(160deg,#20252c,#2e353e);}
#secret-w .dial{display:block;margin:0 auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5));}
#secret-w .dial .rot{transform-box:view-box;transform-origin:50% 50%;transition:transform 1s cubic-bezier(.5,0,.2,1);}
#secret-w .dial .ring{transition:stroke .4s;}
#secret-w.opening .dial .rot{transform:rotate(300deg);} #secret-w.opening .dial .ring{stroke:#3ddc84;}
#secret-w .ti{letter-spacing:.12em;}
#secret-w .d{border-radius:8px;background:#0b0f12;border:1.5px solid #3a424c;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);}
#secret-w .d.cur{border-color:#c9a24a;}
#secret-w .d i{background:#3ddc84;box-shadow:0 0 8px #3ddc84;}
#secret-w .code.ok .d{border-color:#3ddc84;}
#secret-w .code.ng .d{border-color:#ff5a5a;} #secret-w .code.ng .d i{background:#ff5a5a;box-shadow:0 0 8px #ff5a5a;}
#secret-w .err{color:#9aa5b1;font-family:ui-monospace,"SF Mono",Menlo,monospace;}
#secret-w .ms{background:#161a1f;border:1.5px solid #c9a24a;border-radius:16px;padding:16px;box-shadow:0 0 0 4px rgba(201,162,74,.12),0 12px 28px rgba(0,0,0,.45);}
#secret-w .mt{color:#e9c873;}
#secret-w .mi{border-radius:10px;border:1px solid #3a424c;}
#secret-w .mf{color:#9aa5b1;}
#secret-w .cl{display:block;margin:14px auto 0;padding:8px 22px;border-radius:999px;border:1px solid #4a535e;background:none;color:#9aa5b1;font-size:13px;cursor:pointer;}
#secret-w .cl:active{background:rgba(255,255,255,.06);}

</style>

"0.8"/><line x1="30.7" y1="68.5" x2="31.3" y2="66.6" stroke="#8b96a3" stroke-width="0.8"/><line x1="26.4" y1="66.7" x2="27.3" y2="64.9" stroke="#8b96a3" stroke-width="0.8"/><line x1="22.4" y1="64.3" x2="23.5" y2="62.7" stroke="#8b96a3" stroke-width="0.8"/><line x1="18.8" y1="61.2" x2="21.6" y2="58.4" stroke="#8b96a3" stroke-width="1.6"/><line x1="15.7" y1="57.6" x2="17.3" y2="56.5" stroke="#8b96a3" stroke-width="0.8"/><line x1="13.3" y1="53.6" x2="15.1" y2="52.7" stroke="#8b96a3" stroke-width="0.8"/><line x1="11.5" y1="49.3" x2="13.4" y2="48.7" stroke="#8b96a3" stroke-width="0.8"/><line x1="10.4" y1="44.7" x2="12.3" y2="44.4" stroke="#8b96a3" stroke-width="0.8"/><line x1="10.0" y1="40.0" x2="14.0" y2="40.0" stroke="#8b96a3" stroke-width="1.6"/><line x1="10.4" y1="35.3" x2="12.3" y2="35.6" stroke="#8b96a3" stroke-width="0.8"/><line x1="11.5" y1="30.7" x2="13.4" y2="31.3" stroke="#8b96a3" stroke-width="0.8"/><line x1="13.3" y1="26.4" x2="15.1" y2="27.3" stroke="#8b96a3" stroke-width="0.8"/><line x1="15.7" y1="22.4" x2="17.3" y2="23.5" stroke="#8b96a3" stroke-width="0.8"/><line x1="18.8" y1="18.8" x2="21.6" y2="21.6" stroke="#8b96a3" stroke-width="1.6"/><line x1="22.4" y1="15.7" x2="23.5" y2="17.3" stroke="#8b96a3" stroke-width="0.8"/><line x1="26.4" y1="13.3" x2="27.3" y2="15.1" stroke="#8b96a3" stroke-width="0.8"/><line x1="30.7" y1="11.5" x2="31.3" y2="13.4" stroke="#8b96a3" stroke-width="0.8"/><line x1="35.3" y1="10.4" x2="35.6" y2="12.3" stroke="#8b96a3" stroke-width="0.8"/><circle cx="40" cy="40" r="20" fill="#3a424c" stroke="#5b6672" stroke-width="1.5"/><g stroke="#9aa5b1" stroke-width="4" stroke-linecap="round"><line x1="40" y1="40" x2="40" y2="24"/><line x1="40" y1="40" x2="53.9" y2="48"/><line x1="40" y1="40" x2="26.1" y2="48"/></g></g><circle cx="40" cy="40" r="6" fill="#c9a24a"/><path d="M40 1 l-4 6 h8z" fill="#c9a24a"/></svg>';
var HEAD = '';

/* ===== data: 表示内容はすべてここで変える(英語で使うときは、文字列をすべて英語にする) ===== */
var data = {
  title: '秘密のメッセージ',                 // string: 見出し
  prompt: 'パスコードを入力してください',     // string: 入力の案内
  passcode: '123456',                        // string: パスコード(数字6桁)。入力がこれと一致するとメッセージが開く
  /* 開いたあとに見せるメッセージ。テキストだけ・画像だけ・画像とテキストのどれでもよい。
   * 型: { title: string, text: string, image: string | null, from: string }
   *   title: 見出し('' で非表示)  text: 本文('' で非表示。改行は \n)
   *   image: 下の IMAGES のキー(画像なしは null)  from: 差出人('' で非表示) */
  message: {
    title: 'お誕生日おめでとう!',
    text: 'いつもありがとう。\nささやかだけど、プレゼントを用意しました。\n今度の週末、一緒に受け取りに行こうね。',
    image: 'photo',
    from: 'ゆきより'
  },
  text: { tap: 'タップして入力', wrong: 'パスコードが違います', opened: 'ロックを解除しました', close: '閉じる' }
};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var CODE = String(data.passcode), L = CODE.length;
var st = HW.getState({ open: false });
if (!st || typeof st.open !== 'boolean') st = { open: false };
function save(){ try { HW.setState(st); } catch (e) {} }
var input = '', busy = false, kpOn = false;

/* 入力はスマホの数字キーボード(inputmode="numeric")で行う。入力欄は枠の上に透明で重ねる */
function lockView(){
  var boxes = '', i;
  for (i = 0; i < L; i++) boxes += '<span class="d"></span>';
  R.innerHTML = '<div class="lk">' + ART + '<div class="ti">' + esc(data.title) + '</div><div class="pr">' + esc(data.prompt) + '</div>' +
    '<label class="code">' + boxes + '<input class="hid" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="' + L + '" aria-label="' + esc(data.prompt) + '"></label>' +
    '<div class="err" aria-live="polite">' + esc(data.text.tap) + '</div></div>';
  var f = R.querySelector('.hid');
  f.addEventListener('focus', function(){ kpOn = true; R.querySelector('.err').textContent = ''; paint(); });
  f.addEventListener('blur', function(){ kpOn = false; paint(); });
  f.addEventListener('input', function(){
    if (busy) { f.value = input; return; }
    input = f.value.replace(/[^0-9]/g, '').slice(0, L); f.value = input;
    paint();
    if (input.length === L) check();
  });
  paint();
}
function paint(){
  R.querySelectorAll('.code .d').forEach(function(d, i){
    d.classList.toggle('f', i < input.length);
    d.classList.toggle('cur', kpOn && i === Math.min(input.length, L - 1));
    d.innerHTML = i < input.length ? '<i></i>' : '';
  });
}
function check(){
  busy = true;
  var code = R.querySelector('.code'), err = R.querySelector('.err'), f = R.querySelector('.hid');
  if (input === CODE) {
    f.blur(); code.classList.add('ok'); R.classList.add('opening'); err.textContent = data.text.opened;
    setTimeout(function(){ st.open = true; save(); busy = false; msgView(true); }, 1100);
  } else {
    code.classList.add('ng'); err.textContent = data.text.wrong;
    setTimeout(function(){ code.classList.remove('ng'); input = ''; f.value = ''; busy = false; paint(); }, 600);
  }
}
function msgView(anim){
  var m = data.message, img = m.image && IMAGES[m.image];
  R.classList.remove('opening');
  R.innerHTML = '<div class="ms' + (anim ? ' in' : '') + '">' + HEAD +
    (m.title ? '<div class="mt">' + esc(m.title) + '</div>' : '') +
    (img ? '<div class="mp"><img class="mi" alt="" src="' + img + '"></div>' : '') +
    (m.text ? '<div class="mx">' + esc(m.text).replace(/\n/g, '<br>') + '</div>' : '') +
    (m.from ? '<div class="mf">' + esc(m.from) + '</div>' : '') + '</div>' +
    '<button type="button" class="cl">' + esc(data.text.close) + '</button>';
  R.querySelector('.cl').onclick = function(){ st.open = false; save(); input = ''; lockView(); };
}
