<!-- データシート: CSV形式のデータを表として表示。行と項目のデータを表か2列で表示する。表示内容は data で変更できる。 -->
<div id="sheet-w"></div>
<style>
#sheet-w{--bg:#fff;--fg:#1c1c1e;--mut:#8e8e93;--line:#e9e9ee;--soft:#f2f2f7;--ac:#3a5ad1;--acs:rgba(58,90,209,.09);--sh:rgba(0,0,0,.14);}
@media (prefers-color-scheme:dark){#sheet-w{--bg:#1c1c1e;--fg:#f2f2f7;--mut:#98989f;--line:#38383a;--soft:#2c2c2e;--ac:#8aa4ff;--acs:rgba(138,164,255,.14);--sh:rgba(0,0,0,.5);}}
#sheet-w{position:relative;box-sizing:border-box;width:100%;padding:12px 12px 10px;background:var(--bg);color:var(--fg);border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:13px;line-height:1.45;-webkit-text-size-adjust:100%;}
#sheet-w *{box-sizing:border-box;}
/* ボタンはタップしても灰色のハイライト・文字の選択・長押しのメニューを出さない */
#sheet-w button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
#sheet-w button:focus:not(:focus-visible){outline:none;}
#sheet-w svg{display:block;flex:none;}
#sheet-w .top{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-height:32px;}
#sheet-w .seg{display:inline-flex;flex:none;padding:2px;border-radius:9px;background:var(--soft);}
#sheet-w .seg button{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;color:var(--mut);transition:background .18s,color .18s,box-shadow .18s;}
#sheet-w .seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px var(--sh);}
/* 表: 1列目は固定。横にずらすと影が出て、右に続きがあるときは右端がうすくなる */
#sheet-w .scw{position:relative;}
#sheet-w .scw::after{content:"";position:absolute;top:0;right:0;bottom:0;width:28px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--bg));opacity:0;transition:opacity .2s;}
#sheet-w .scw.r::after{opacity:1;}
#sheet-w .sc{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;}
#sheet-w .sc::-webkit-scrollbar{display:none;}
#sheet-w table{border-collapse:separate;border-spacing:0;min-width:100%;}
#sheet-w th,#sheet-w td{text-align:left;vertical-align:top;}
#sheet-w th{padding:0;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600;}
#sheet-w td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;}
#sheet-w tr:last-child td{border-bottom:0;}
#sheet-w td.n,#sheet-w .v.n{text-align:right;font-variant-numeric:tabular-nums;}
#sheet-w th:first-child,#sheet-w td:first-child{position:sticky;left:0;z-index:1;background:var(--bg);min-width:8em;max-width:10.5em;white-space:normal;transition:box-shadow .2s;}
#sheet-w td:first-child{font-weight:600;overflow-wrap:anywhere;}
#sheet-w .sc.l th:first-child,#sheet-w .sc.l td:first-child{box-shadow:8px 0 8px -8px var(--sh);}
/* 並べている項目の列はうすく色を付ける */
#sheet-w td.on{background:linear-gradient(var(--acs),var(--acs)),var(--bg);}
#sheet-w .hb{display:flex;align-items:center;gap:3px;width:100%;min-height:36px;padding:0 10px;font-size:11.5px;font-weight:600;color:var(--mut);text-align:left;white-space:nowrap;}
#sheet-w th.n .hb{justify-content:flex-end;}
#sheet-w th.on .hb{color:var(--ac);}
#sheet-w .hb:active{opacity:.6;}
/* 2列: 左に行の名前、右にほかの項目を縦に並べる */
#sheet-w .ls .row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
#sheet-w .ls .row:last-child{border-bottom:0;}
#sheet-w .ls .t{flex:0 0 36%;min-width:0;font-weight:600;overflow-wrap:anywhere;}
#sheet-w .ls .at{flex:1;min-width:0;}
#sheet-w .ls .a{display:flex;align-items:baseline;gap:10px;padding:1.5px 0;}
#sheet-w .ls .k{flex:none;max-width:55%;font-size:11.5px;color:var(--mut);overflow-wrap:anywhere;}
#sheet-w .ls .v{flex:1;min-width:0;overflow-wrap:anywhere;text-align:right;}   /* 2列では文字も数値も右寄せ */
#sheet-w .ls .a.on .k,#sheet-w .ls .a.on .v{color:var(--ac);font-weight:600;}
#sheet-w .bd{transition:opacity .15s;}
#sheet-w .bd.fd{opacity:0;}
/* 全体は高さ 550px まで。超えるときは見出し・上の段を残して、データの行だけをスクロールする。少ないときは中身の高さ */
#sheet-w{display:flex;flex-direction:column;max-height:550px;}
#sheet-w .top{flex:none;}
#sheet-w .bd,#sheet-w .scw{display:flex;flex-direction:column;min-height:0;}
#sheet-w .sc{min-height:0;overflow-y:auto;}
#sheet-w .ls{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#sheet-w th{position:sticky;top:0;z-index:2;background:var(--bg);}
#sheet-w th:first-child{top:0;z-index:3;}
/* 下に続きがあるときは、データの下端を背景色へうすくして、スクロールできることを示す */
#sheet-w .bd{position:relative;}
#sheet-w .bd::after{content:"";position:absolute;left:0;right:0;bottom:0;z-index:4;height:60px;pointer-events:none;background:linear-gradient(180deg,transparent,var(--bg));opacity:0;transition:opacity .2s;}
#sheet-w .bd.b::after{opacity:1;}
@media (prefers-reduced-motion:reduce){#sheet-w *{transition:none !important;animation:none !important;}}

#sheet-w .top{gap:6px;}
#sheet-w .stat{flex:1;min-width:0;display:flex;}
/* 歯車: 表では見出しの行の一番右(横にスクロールしきると見える) */
#sheet-w th.g{width:1%;padding:0;}
#sheet-w td.g{padding:0;}
#sheet-w .gr{display:flex;align-items:center;justify-content:center;width:34px;height:36px;color:var(--mut);}
#sheet-w .gr:active{opacity:.5;}
/* 項目を選ぶあいだ: すべての項目を出し、名前の左に × か + を付ける。隠す項目と、データの部分は薄くする */
#sheet-w .hb .mk{display:none;}
#sheet-w.edit .hb .mk{display:flex;}
#sheet-w.edit .hb .mk{color:var(--mut);}
#sheet-w.edit .hb{color:var(--fg);}
#sheet-w.edit .hb .ar{display:none;}
#sheet-w.edit .hb.lock{cursor:default;}
#sheet-w.edit .hd .hb,#sheet-w.edit .hb.hd{opacity:.42;}
#sheet-w.edit th.on .hb{color:var(--fg);}
#sheet-w.edit td.on{background:var(--bg);}
#sheet-w.edit .ls .a.on .k,#sheet-w.edit .ls .a.on .v{color:var(--mut);font-weight:inherit;}
#sheet-w.edit td,#sheet-w.edit .ls .t,#sheet-w.edit .ls .v{color:var(--mut);}
#sheet-w.edit th.hd,#sheet-w.edit td.hd{background:var(--soft);}
#sheet-w.edit td.hd,#sheet-w.edit .ls .a.hd .k,#sheet-w.edit .ls .a.hd .v{color:color-mix(in srgb,var(--mut) 55%,var(--bg));}
#sheet-w.edit .ls .a.hd{background:var(--soft);border-radius:4px;margin:0 -6px;padding-left:6px;padding-right:6px;}
#sheet-w.edit .seg{opacity:.4;pointer-events:none;}
/* 「キャンセル」「決定」は、項目を選んでいるあいだだけ左上に出す */
#sheet-w .stat{gap:6px;}
#sheet-w .cnt{font-size:12px;color:var(--mut);white-space:nowrap;}
#sheet-w.vt .cnt{padding-left:10px;}   /* 表では「名前」の見出しと左端をそろえる */
#sheet-w .stat{align-items:center;}
#sheet-w .stat>button,#sheet-w .mf button{height:30px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:600;}
#sheet-w .cc{color:var(--fg);background:var(--soft);}
#sheet-w .ok{color:#fff;background:var(--ac);}
#sheet-w .stat>button:active,#sheet-w .mf button:active{opacity:.7;}
#sheet-w .ok:disabled{opacity:.35;cursor:default;}
/* 2列: 右上(表・2列の切り替えの左)の「並び替え」から開くメニュー。項目を押すと並び替え、「非表示設定」で隠す項目を選ぶ */
#sheet-w .dd{position:relative;flex:none;margin-left:auto;}   /* 表・2列の切り替えのすぐ左 */
/* ふだんは背景なし。メニューを開いているあいだだけ色を付ける。並べているときは「人口(万人) ↓」のように出し、120px を超える名前は … で切る */
#sheet-w .sb{display:inline-flex;align-items:center;gap:5px;max-width:120px;height:30px;padding:0 8px;border-radius:9px;font-size:13px;font-weight:500;color:var(--mut);transition:background .15s,color .15s;}
#sheet-w .dd.open .sb{background:var(--soft);color:var(--fg);}
#sheet-w .sb.on{font-weight:600;color:var(--ac);}   /* 並べているときは太い青字 */

#sheet-w .dd.open .sb .cv{transform:rotate(180deg);}
#sheet-w .sb:active{opacity:.7;}

#sheet-w .dd.open .mn{visibility:visible;opacity:1;transform:none;transition:opacity .15s,transform .18s cubic-bezier(.2,.8,.2,1);}
#sheet-w .mi{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0 10px;border-radius:8px;font-size:14px;text-align:left;}
#sheet-w button.mi:active{background:var(--soft);}
#sheet-w .mi.on{color:var(--ac);font-weight:600;}
#sheet-w .mi .ar{margin-left:auto;}
#sheet-w .mi.g{color:var(--mut);}

#sheet-w .mi.hd{background:var(--soft);color:var(--mut);border-radius:0;}
#sheet-w .mi.lock{color:var(--mut);}
/* メニューは全体の高さ(550px)に収まるようにし、項目が多いときは項目の部分だけをスクロールする。非表示設定の「表示列を修正」「キャンセル」は常に見える */

#sheet-w .mis{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;}

#sheet-w .mf{flex:none;}
#sheet-w .mf{display:flex;flex-direction:column;gap:6px;padding:8px 2px 2px;}
#sheet-w .mf button{height:38px;}

} : {
  table: '表', list: '2列', count: function(n){ return n + '件'; },
  numAsc: '小さい順', numDesc: '大きい順', txtAsc: '昇順', txtDesc: '降順',
  sortBy: '並び替え',
  cols: '表示する項目を選ぶ', hideSet: '非表示設定', resetSort: 'リセット', cancel: 'キャンセル', ok: '表示列を修正', hideCol: function(c){ return c + ' を隠す'; }, showCol: function(c){ return c + ' を表示する'; },
  badCols: "columns は項目の名前の配列で書いてください(例: ['名前', '価格'])",
  dupCol: function(c){ return '項目の名前 ' + JSON.stringify(c) + ' が重なっています'; },
  badRows: 'rows は行の配列で書いてください',
  badRow: function(i, m, n){ return (i + 1) + '行目の値は' + m + '個ありますが、columns は' + n + '個です。同じ数にしてください'; },
  badCell: function(i, c, v){ return (i + 1) + '行目の ' + c + ' の値 ' + JSON.stringify(v) + ' は文字・数値・null のどれかで書いてください'; },
  badSort: function(c){ return 'sort.column の ' + JSON.stringify(c) + ' は columns にありません'; },
  badHidden: function(c){ return 'hidden の ' + JSON.stringify(c) + ' は columns にありません'; },
  badView: "view は 'table' か 'list' で書いてください"
};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---- data を確かめる ---- */
var COLS = data.columns, ROWS = data.rows;
if (!Array.isArray(COLS) || !COLS.length || COLS.some(function(c){ return typeof c !== 'string' || !c; })) throw new Error(T.badCols);
COLS.forEach(function(c, j){ if (COLS.indexOf(c) !== j) throw new Error(T.dupCol(c)); });
if (!Array.isArray(ROWS)) throw new Error(T.badRows);
ROWS.forEach(function(r, i){
  var m = Array.isArray(r) ? r.length : 0;
  if (m !== COLS.length) throw new Error(T.badRow(i, m, COLS.length));
  r.forEach(function(v, j){
    if (!(v === null || typeof v === 'string' || (typeof v === 'number' && isFinite(v)))) throw new Error(T.badCell(i, COLS[j], v));
  });
});
if (data.view != null && data.view !== 'table' && data.view !== 'list') throw new Error(T.badView);
if (data.sort && COLS.indexOf(data.sort.column) < 0) throw new Error(T.badSort(data.sort.column));
(data.hidden || []).forEach(function(c){ if (COLS.indexOf(c) < 0) throw new Error(T.badHidden(c)); });

/* ---- 表示の状態。見る人の操作は保存し、次に開いたときもそのまま出す ---- */
var view, sortCol, sortDesc, hidden;
function setState(s){
  view = s && s.view === 'list' ? 'list' : 'table';
  sortCol = s && s.sort ? COLS.indexOf(s.sort.column) : -1;
  sortDesc = sortCol >= 0 && !!s.sort.desc;
  hidden = {};
  ((s && s.hidden) || []).forEach(function(c){ var j = COLS.indexOf(c); if (j > 0) hidden[j] = true; });
  if (hidden[sortCol]) sortCol = -1;
}
var INIT = { view: data.view || 'table', sort: data.sort || null, hidden: data.hidden || [] };
var saved = null;
try { saved = HW.getState(null); } catch (e) {}
setState(saved && typeof saved === 'object' ? saved : INIT);
function save(){
  try { HW.setState({ view: view, sort: sortCol < 0 ? null : { column: COLS[sortCol], desc: sortDesc }, hidden: COLS.filter(function(c, j){ return hidden[j]; }) }); } catch (e) {}
}

/* 項目ごとに、値がすべて数値(と null)なら数値の項目とみなす。見出しの寄せと並び替えの言葉に使う */
var NUMCOL = COLS.map(function(c, j){
  var any = false;
  return ROWS.every(function(r){ if (typeof r[j] === 'number') any = true; return r[j] === null || typeof r[j] === 'number'; }) && any;
});
/* 数値の小数の桁は、項目ごとに一番多い桁にそろえる(4.0 と 4.6 が並んだら 4.0 と出す) */
var DEC = COLS.map(function(c, j){
  return ROWS.reduce(function(m, r){ var v = r[j]; return typeof v === 'number' ? Math.max(m, (String(v).split('.')[1] || '').length) : m; }, 0);
});
function cell(v, j){ return v === null ? '' : typeof v === 'number' ? v.toLocaleString(LOC, { minimumFractionDigits: DEC[j], maximumFractionDigits: DEC[j] }) : String(v); }
function dirWord(j, desc){ return NUMCOL[j] ? (desc ? T.numDesc : T.numAsc) : (desc ? T.txtDesc : T.txtAsc); }
function visCols(){ return COLS.map(function(c, j){ return j; }).filter(function(j){ return !hidden[j]; }); }
/* 項目を選んでいるあいだ(draft があるとき)は、隠す項目も含めてすべて出す */
var draft = null;
function shownCols(){ return draft ? COLS.map(function(c, j){ return j; }) : visCols(); }
function isHd(j){ return !!(draft && draft[j]); }
/* 下書きが今の表示と違うか。同じなら「表示列を修正」は押せなくする */
function changed(){ return COLS.some(function(c, j){ return !!draft[j] !== !!hidden[j]; }); }

/* 並び替え。null はいつも最後。数値は数値の順、文字は辞書順(数字は数値として比べる) */
function sorted(){
  var idx = ROWS.map(function(r, i){ return i; });
  if (sortCol < 0) return idx;
  var j = sortCol, dir = sortDesc ? -1 : 1;
  return idx.sort(function(a, b){
    var x = ROWS[a][j], y = ROWS[b][j];
    if (x === null || y === null) return x === y ? a - b : x === null ? 1 : -1;
    var c = typeof x === 'number' && typeof y === 'number' ? x - y : typeof x === 'number' ? -1 : typeof y === 'number' ? 1 : x.localeCompare(y, LOC, { numeric: true });
    return c ? c * dir : a - b;
  });
}

/* ---- アイコン ---- */
var IC = {
  up: '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10V2M2.5 5.5L6 2l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  down: '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v8M2.5 6.5L6 10l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chev: '<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M1.5 3L4 5.5 6.5 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  table: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="2" width="11" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 5.5h11M1.5 8.7h11M5.3 2v10" stroke="currentColor" stroke-width="1.3"/></svg>',
  list: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 3h4M1.5 8.5h4M8 3h4.5M8 5.2h4.5M8 8.5h4.5M8 10.7h4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
  reset: '<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.4-3.3M2.5 2v2.5H5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
function segHtml(){
  return '<div class="seg" role="group">' + ['table', 'list'].map(function(v){
    return '<button type="button" data-v="' + v + '" aria-label="' + T[v] + '">' + IC[v] + '</button>';
  }).join('') + '</div>';
}

/* ---- 表と2列の HTML。見出し・項目名の中身は案ごとに渡す ---- */
function tableHtml(head, gear){
  var vis = shownCols();
  return '<div class="scw"><div class="sc"><table><thead><tr>' + vis.map(function(j){
    return '<th class="' + (NUMCOL[j] ? 'n' : '') + (j === sortCol ? ' on' : '') + (isHd(j) ? ' hd' : '') + '">' + head(j) + '</th>';
  }).join('') + '<th class="g">' + gear + '</th></tr></thead><tbody>' + sorted().map(function(i){
    return '<tr>' + vis.map(function(j, c){
      var v = ROWS[i][j];
      return '<td data-r="' + i + '" data-c="' + j + '" class="' + (typeof v === 'number' ? 'n' : '') + (j === sortCol ? ' on' : '') + (isHd(j) ? ' hd' : '') + '">' + esc(cell(v, j)) + '</td>';
    }).join('') + '<td class="g"></td></tr>';
  }).join('') + '</tbody></table></div></div>';
}
function listHtml(key){
  var vis = shownCols().slice(1);
  return '<div class="ls">' + sorted().map(function(i){
    return '<div class="row" data-r="' + i + '"><div class="t">' + esc(cell(ROWS[i][0], 0)) + '</div><div class="at">' + vis.map(function(j){
      var v = ROWS[i][j];
      return '<div class="a' + (j === sortCol ? ' on' : '') + (isHd(j) ? ' hd' : '') + '"><span class="k">' + key(j) + '</span><span class="v' + (typeof v === 'number' ? ' n' : '') + '">' + esc(cell(v, j)) + '</span></div>';
    }).join('') + '</div></div>';
  }).join('') + '</div>';
}

/* 描き替え。並び順が変わった行は、元の位置からすべるように動かす(FLIP) */
var BD;
var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function paint(html, fade){
  var before = {};
  [].forEach.call(BD.querySelectorAll('[data-r]'), function(el){ before[el.dataset.r + '|' + (el.dataset.c || '')] = el.getBoundingClientRect().top; });
  var old = BD.querySelector('.sc'), sl = old ? old.scrollLeft : 0;
  var oldV = BD.querySelector('.sc,.ls'), st = oldV && !fade ? oldV.scrollTop : 0;   // 縦のスクロール位置も描き替えの前後で保つ(表示を切り替えたときは先頭から)
  BD.innerHTML = html;
  var sc = BD.querySelector('.sc'), ls = BD.querySelector('.ls');
  if (ls) ls.scrollTop = st;
  var v = sc || ls;   // 縦にスクロールする要素
  var below = function(){ BD.classList.toggle('b', v.scrollTop + v.clientHeight < v.scrollHeight - 1); };
  v.addEventListener('scroll', below, { passive: true });
  below();
  if (sc) {
    sc.scrollLeft = sl;
    sc.scrollTop = st;
    var edge = function(){ sc.classList.toggle('l', sc.scrollLeft > 1); sc.parentNode.classList.toggle('r', sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 1); };
    sc.addEventListener('scroll', edge, { passive: true });
    edge();
  }
  if (fade && !REDUCE) { BD.classList.add('fd'); requestAnimationFrame(function(){ requestAnimationFrame(function(){ BD.classList.remove('fd'); }); }); return; }
  if (REDUCE) return;
  [].forEach.call(BD.querySelectorAll('[data-r]'), function(el){
    var t = before[el.dataset.r + '|' + (el.dataset.c || '')];
    if (t == null) return;
    var dy = t - el.getBoundingClientRect().top;
    if (Math.abs(dy) < 1) return;
    el.style.transition = 'none';
    el.style.transform = 'translateY(' + dy + 'px)';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      el.style.transition = 'transform .34s cubic-bezier(.2,.8,.2,1)';
      el.style.transform = '';
    }); });
  });
}

R.innerHTML = '<div class="top"><div class="stat"></div>' + segHtml() + '</div>' +
  '<div class="bd"></div>';
BD = R.querySelector('.bd');
var STAT = R.querySelector('.stat'), menu = null, misTop = 0;   // menu: 2列のメニュー。null(閉じている)・'sort'・'edit'
IC.gear = '<svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-dasharray="2.356 2.356"/><circle cx="8" cy="8" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="8" r="1.7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
IC.xc = '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M4.6 8h6.8" stroke="var(--bg)" stroke-width="1.7" stroke-linecap="round"/></svg>';
IC.pc = '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.6v6.8M4.6 8h6.8" stroke="var(--bg)" stroke-width="1.7" stroke-linecap="round"/></svg>';
var GEAR = '<button type="button" class="gr" aria-label="' + T.cols + '">' + IC.gear + '</button>';

/* 見出し。ふだんは押すと並び替わる。項目を選んでいるあいだは、1つ目以外に − (隠す) か + (表示する) を付ける */
function head(j){
  var on = j === sortCol, hd = isHd(j);
  var mk = draft && j ? '<span class="mk ' + (hd ? 'p' : 'x') + '">' + (hd ? IC.pc : IC.xc) + '</span>' : '';
  var label = draft && j ? ' aria-label="' + esc(hd ? T.showCol(COLS[j]) : T.hideCol(COLS[j])) + '"' : '';
  return '<button type="button" class="hb' + (on ? ' on' : '') + (j ? '' : ' lock') + (hd ? ' hd' : '') + '" data-j="' + j + '"' + label + (draft && !j ? ' disabled' : '') + '>' +
    mk + esc(COLS[j]) + (on ? '<span class="ar">' + (sortDesc ? IC.down : IC.up) + '</span>' : '') + '</button>';
}
/* 2列のメニューの中身。ふだんは並び替えの項目と「非表示設定」、非表示設定のあいだは − / + の付いた項目と「表示列を修正」「キャンセル」 */
function menuHtml(){
  if (menu === 'edit') return '<div class="mis">' + COLS.map(function(c, j){
    if (!j) return '<div class="mi lock"><span class="mm"></span>' + esc(c) + '</div>';   // 1つ目(行の名前)は隠せない
    return '<button type="button" class="mi' + (draft[j] ? ' hd' : '') + '" data-e="' + j + '" aria-label="' + esc(draft[j] ? T.showCol(c) : T.hideCol(c)) + '"><span class="mm">' + (draft[j] ? IC.pc : IC.xc) + '</span>' + esc(c) + '</button>';
  }).join('') + '</div><div class="mf"><button type="button" class="ok"' + (changed() ? '' : ' disabled') + '>' + T.ok + '</button><button type="button" class="cc">' + T.cancel + '</button></div>';
  return '<div class="mis">' + visCols().map(function(j){
    var on = j === sortCol;
    return '<button type="button" class="mi' + (on ? ' on' : '') + '" data-s="' + j + '">' + esc(COLS[j]) + (on ? '<span class="ar">' + (sortDesc ? IC.down : IC.up) + '</span>' : '') + '</button>';
  }).join('') + (sortCol >= 0 ? '<button type="button" class="mi g mr">' + IC.reset + T.resetSort + '</button>' : '') + '<div class="sep"></div><button type="button" class="mi g mg">' + IC.gear + T.hideSet + '</button></div>';
}
function startEdit(){ draft = {}; for (var k in hidden) draft[k] = true; }
/* 同じ項目を押すたびに 小さい順 → 大きい順 → 元の順 */
function cycle(j){
  if (sortCol !== j) { sortCol = j; sortDesc = false; }
  else if (!sortDesc) sortDesc = true;
  else sortCol = -1;
  save();
}
function render(fade){
  R.classList.toggle('edit', !!draft);
  R.classList.toggle('vt', view === 'table');
  [].forEach.call(R.querySelectorAll('.seg button'), function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === view)); });
  var cnt = '<span class="cnt">' + esc(T.count(ROWS.length)) + '</span>';
  if (view === 'table') STAT.innerHTML = draft ? '<button type="button" class="cc">' + T.cancel + '</button><button type="button" class="ok"' + (changed() ? '' : ' disabled') + '>' + T.ok + '</button>' : cnt;
  else STAT.innerHTML = cnt + '<div class="dd' + (menu ? ' open' : '') + '"><button type="button" class="sb' + (sortCol >= 0 ? ' on' : '') + '" aria-haspopup="true" aria-expanded="' + !!menu + '"' + (sortCol >= 0 ? ' aria-label="' + esc(T.sortBy + ': ' + COLS[sortCol] + ' ' + dirWord(sortCol, sortDesc)) + '"' : '') + '>' +
    (sortCol >= 0 ? '<span class="sl">' + esc(COLS[sortCol]) + '</span>' + (sortDesc ? IC.down : IC.up) : '<span class="sl">' + T.sortBy + '</span><span class="cv">' + IC.chev + '</span>') + '</button>' +
    '<div class="mn" role="menu">' + menuHtml() + '</div></div>';
  var mis = STAT.querySelector('.mis');
  if (mis) {
    mis.scrollTop = misTop;
    var more = function(){ misTop = mis.scrollTop; mis.classList.toggle('b', mis.scrollTop + mis.clientHeight < mis.scrollHeight - 1); };
    mis.addEventListener('scroll', more, { passive: true });
    more();
  }
  paint(view === 'table' ? tableHtml(head, draft ? '' : GEAR) : listHtml(function(j){ return esc(COLS[j]); }), fade);
}

R.addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.dataset.v) { if (view !== b.dataset.v) { view = b.dataset.v; menu = null; draft = null; save(); render(true); } return; }
  if (b.classList.contains('sb')) { if (menu) { menu = null; draft = null; } else { menu = 'sort'; misTop = 0; } render(); return; }
  if (b.classList.contains('gr')) { startEdit(); render(); return; }        // 表の歯車
  if (b.classList.contains('mr')) { sortCol = -1; save(); menu = null; render(); return; }   // メニューの「リセット」: 元の順に戻す
  if (b.classList.contains('mg')) { startEdit(); menu = 'edit'; misTop = 0; render(); return; }   // メニューの「非表示設定」
  if (b.classList.contains('cc')) { draft = null; menu = null; render(); return; }
  if (b.classList.contains('ok')) {
    hidden = draft; draft = null; menu = null;
    if (hidden[sortCol]) sortCol = -1;
    save(); render(); return;
  }
  if (b.dataset.s) { cycle(+b.dataset.s); menu = null; render(); return; }  // メニューで項目を選んだら並び替えて閉じる
  if (b.dataset.e) { var k = +b.dataset.e; if (draft[k]) delete draft[k]; else draft[k] = true; render(); return; }
  if (b.classList.contains('hb')) {
    var j = +b.dataset.j;
    if (draft) { if (j) { if (draft[j]) delete draft[j]; else draft[j] = true; } }
    else cycle(j);
    render();
  }
});
/* メニューの外を押すか Esc で閉じる(非表示設定の途中なら取り消す) */
function closeMenu(){ if (!menu) return; menu = null; draft = null; render(); }
document.addEventListener('click', function(e){
  if (!menu || !document.contains(e.target)) return;   // 押したボタンが描き替えで外れたとき(メニューの中の操作)は閉じない
  if (!e.target.closest('#sheet-w .dd')) closeMenu();
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeMenu(); });
render();

} catch (e) { R.innerHTML = '<pre style="margin:0;padding:12px;font-size:12px;color:#d33;white-space:pre-wrap;">' + esc0(String(e)) + '</pre>'; }
function esc0(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
})();
</script>
