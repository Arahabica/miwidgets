<!-- データシート: CSV形式のデータを表として表示。行と項目のデータを表か2列で表示する。表示内容は data で変更できる。 -->
<div id="sheet-w"></div>
<style>
#sheet-w{--bg:#fff;--fg:#1c1c1e;--mut:#8e8e93;--line:#e9e9ee;--soft:#f2f2f7;--ac:#3a5ad1;--acs:rgba(58,90,209,.09);--sh:rgba(0,0,0,.14);position:relative;display:flex;flex-direction:column;box-sizing:border-box;width:100%;max-height:550px;padding:12px 12px 10px;background:var(--bg);color:var(--fg);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%;}
@media (prefers-color-scheme:dark){#sheet-w{--bg:#1c1c1e;--fg:#f2f2f7;--mut:#98989f;--line:#38383a;--soft:#2c2c2e;--ac:#8aa4ff;--acs:rgba(138,164,255,.14);--sh:rgba(0,0,0,.5);}}
#sheet-w *{box-sizing:border-box;}
/* タップ時のハイライト・選択・長押しメニューを出さない */
#sheet-w button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
#sheet-w button:focus:not(:focus-visible){outline:none;}
#sheet-w button:not(:disabled):active{opacity:.6;}
#sheet-w button:disabled{cursor:default;}
#sheet-w svg{display:block;flex:none;}
/* 上の段: 件数(列を選ぶあいだはキャンセル・修正)、並び替え(2列)、表示の切り替え */
#sheet-w .top{flex:none;display:flex;align-items:center;gap:6px;min-height:32px;margin-bottom:10px;}
#sheet-w .stat{flex:1;min-width:0;display:flex;align-items:center;gap:6px;}
#sheet-w .cnt{font-size:12px;color:var(--mut);white-space:nowrap;}
#sheet-w.vt .cnt{padding-left:10px;}
#sheet-w .seg{flex:none;display:flex;padding:2px;border-radius:9px;background:var(--soft);}
#sheet-w .seg button{height:28px;padding:0 9px;border-radius:7px;color:var(--mut);transition:background .18s,color .18s,box-shadow .18s;}
#sheet-w .seg [aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px var(--sh);}
#sheet-w.edit .seg{opacity:.4;pointer-events:none;}
#sheet-w .stat>button,#sheet-w .mf button{height:30px;padding:0 14px;border-radius:9px;font-weight:600;}
#sheet-w .cc{background:var(--soft);}
#sheet-w .ok{color:#fff;background:var(--ac);}
#sheet-w .ok:disabled{opacity:.35;}
/* データ: 550px を超えるとデータだけスクロール。続きがある端はうすくする */
#sheet-w .bd,#sheet-w .scw{position:relative;display:flex;flex-direction:column;min-height:0;}
#sheet-w .bd{transition:opacity .15s;}
#sheet-w .bd.fd{opacity:0;}
#sheet-w .bd::after,#sheet-w .scw::after{content:"";position:absolute;right:0;bottom:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .2s;}
#sheet-w .bd::after{left:0;height:60px;background:linear-gradient(transparent,var(--bg));}
#sheet-w .scw::after{top:0;width:28px;background:linear-gradient(90deg,transparent,var(--bg));}
#sheet-w .bd.b::after,#sheet-w .scw.r::after{opacity:1;}
#sheet-w .sc,#sheet-w .ls{min-height:0;overflow:auto;overscroll-behavior-x:contain;scrollbar-width:none;}
#sheet-w .sc::-webkit-scrollbar,#sheet-w .ls::-webkit-scrollbar{display:none;}
/* 表: 見出しと1列目は固定 */
#sheet-w table{border-collapse:separate;border-spacing:0;min-width:100%;}
#sheet-w th,#sheet-w td{padding:10px;text-align:left;vertical-align:top;white-space:nowrap;background:var(--bg);border-bottom:1px solid var(--line);}
#sheet-w th{position:sticky;top:0;z-index:2;padding:0;}
#sheet-w tr:last-child td{border-bottom:0;}
#sheet-w th:first-child,#sheet-w td:first-child{position:sticky;left:0;z-index:1;min-width:8em;max-width:10.5em;white-space:normal;transition:box-shadow .2s;}
#sheet-w th:first-child{z-index:3;}
#sheet-w td:first-child{font-weight:600;overflow-wrap:anywhere;}
#sheet-w .sc.l th:first-child,#sheet-w .sc.l td:first-child{box-shadow:8px 0 8px -8px var(--sh);}
#sheet-w .n{text-align:right;font-variant-numeric:tabular-nums;}
#sheet-w td.on{background:linear-gradient(var(--acs),var(--acs)),var(--bg);}
#sheet-w .hb{display:flex;align-items:center;gap:3px;width:100%;min-height:36px;padding:0 10px;font-size:11.5px;font-weight:600;color:var(--mut);white-space:nowrap;}
#sheet-w .n .hb{justify-content:flex-end;}
#sheet-w .on .hb{color:var(--ac);}
#sheet-w .g{width:1%;padding:0;}
#sheet-w .gr{display:flex;align-items:center;justify-content:center;width:34px;height:36px;color:var(--mut);}
/* 2列 */
#sheet-w .row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
#sheet-w .row:last-child{border-bottom:0;}
#sheet-w .t{flex:0 0 36%;min-width:0;font-weight:600;overflow-wrap:anywhere;}
#sheet-w .at{flex:1;min-width:0;}
#sheet-w .a{display:flex;align-items:baseline;gap:10px;padding:1.5px 0;}
#sheet-w .k{flex:none;max-width:55%;font-size:11.5px;color:var(--mut);overflow-wrap:anywhere;}
#sheet-w .v{flex:1;min-width:0;text-align:right;overflow-wrap:anywhere;}
#sheet-w .a.on>*{color:var(--ac);font-weight:600;}
/* 列を選ぶあいだ: 文字を薄く、隠す列は灰色の背景 */
#sheet-w .mk{display:flex;width:15px;color:var(--mut);}
#sheet-w.edit .hb{color:var(--fg);}
#sheet-w.edit .hb.hd{opacity:.42;}
#sheet-w.edit td,#sheet-w.edit .t,#sheet-w.edit .v{color:var(--mut);}
#sheet-w.edit .hd{background:var(--soft);}
#sheet-w.edit td.hd,#sheet-w.edit .a.hd>*{color:color-mix(in srgb,var(--mut) 55%,var(--bg));}
#sheet-w.edit .a.hd{margin:0 -6px;padding:1.5px 6px;border-radius:4px;}
/* 2列の並び替えボタンとメニュー */
#sheet-w .dd{position:relative;flex:none;margin-left:auto;}
#sheet-w .sb{display:flex;align-items:center;gap:5px;max-width:120px;height:30px;padding:0 8px;border-radius:9px;font-weight:500;color:var(--mut);transition:background .15s,color .15s;}
#sheet-w .open .sb{background:var(--soft);color:var(--fg);}
#sheet-w .sb.on{font-weight:600;color:var(--ac);}
#sheet-w .sl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#sheet-w .cv{transition:transform .18s;}
#sheet-w .open .cv{transform:rotate(180deg);}
#sheet-w .mn{position:absolute;top:calc(100% + 6px);right:0;z-index:10;display:flex;flex-direction:column;width:max-content;min-width:200px;max-width:min(280px,calc(100vw - 40px));max-height:488px;padding:6px;border-radius:13px;background:var(--bg);box-shadow:0 10px 30px var(--sh),0 0 0 1px var(--line);visibility:hidden;opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top right;transition:opacity .15s,transform .18s cubic-bezier(.2,.8,.2,1),visibility 0s .18s;}
#sheet-w .open .mn{visibility:visible;opacity:1;transform:none;transition-delay:0s;}
#sheet-w .mis{min-height:0;overflow-y:auto;overscroll-behavior:contain;}
#sheet-w .mis.b{-webkit-mask-image:linear-gradient(#000 calc(100% - 48px),transparent);}
#sheet-w .mi{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0 10px;border-radius:8px;font-size:14px;text-align:left;}
#sheet-w .mi.on{color:var(--ac);font-weight:600;}
#sheet-w .mi .ar{margin-left:auto;}
#sheet-w .mi.g,#sheet-w .mi.lock,#sheet-w .mi.hd{color:var(--mut);}
#sheet-w .mi.hd{border-radius:0;}
#sheet-w .mi.g svg{width:16px;height:16px;}
#sheet-w .sep{height:1px;margin:5px 6px;background:var(--line);}
#sheet-w .mf{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 2px 2px;}
#sheet-w .mf button{height:38px;}
@media (prefers-reduced-motion:reduce){#sheet-w *{transition:none !important;}}
</style>
<script>
(function(){
var R = document.getElementById("sheet-w");
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
try {
/* hatchWidget が無いブラウザではメモリに保存する */
var HW = window.hatchWidget || (function(){ var s = null; return { getState: function(d){ return s === null ? d : s; }, setState: function(v){ s = v; } }; })();

/* ===== data: 表示内容はすべてここで変える ===== */
var data = {
  lang: 'ja',          // 'ja' | 'en': 画面の文言と数値の書式の言語
  view: 'table',       // 'table' | 'list': 最初の表示。table は表、list は2列(1列目に行の名前、2列目にほかの項目を縦に並べる)
  /* 項目の名前。1つ目は行の名前(2列表示の1列目)になる */
  columns: ['都道府県', '県庁所在地', '人口(万人)', '面積(km²)'],
  /* 行。各行は columns と同じ数の値。数値は右寄せ、文字は左寄せで表示する。値が無いときは null */
  rows: [
    ['滋賀県', '大津市', 141, 4017],
    ['京都府', '京都市', 258, 4612],
    ['大阪府', '大阪市', 884, 1905],
    ['兵庫県', '神戸市', 547, 8401],
    ['奈良県', '奈良市', 132, 3691],
    ['和歌山県', '和歌山市', 92, 4725]
  ],
  sort: null,          // 最初の並び順。{ column: '人口(万人)', desc: true } の形で書く。null なら rows の順
  hidden: []           // 最初に隠す項目の名前。例: ['面積(km²)']。1つ目の項目は隠せない
};

var EN = data.lang === 'en';
var LOC = EN ? 'en-US' : 'ja-JP';
var T = EN ? {
  table: 'Table', list: 'List', count: function(n){ return n + (n === 1 ? ' row' : ' rows'); },
  numAsc: 'Low to high', numDesc: 'High to low', txtAsc: 'A to Z', txtDesc: 'Z to A',
  sortBy: 'Sort',
  cols: 'Choose columns', hideSet: 'Hide columns', resetSort: 'Reset', cancel: 'Cancel', ok: 'Update columns', hideCol: function(c){ return 'Hide ' + c; }, showCol: function(c){ return 'Show ' + c; }
} : {
  table: '表', list: '2列', count: function(n){ return n + '件'; },
  numAsc: '小さい順', numDesc: '大きい順', txtAsc: '昇順', txtDesc: '降順',
  sortBy: '並び替え',
  cols: '表示する項目を選ぶ', hideSet: '非表示設定', resetSort: 'リセット', cancel: 'キャンセル', ok: '表示列を修正', hideCol: function(c){ return c + ' を隠す'; }, showCol: function(c){ return c + ' を表示する'; }
};
/* data の書き方の誤りは、英語で画面に出す */
var E = {
  badCols: "columns must be an array of one or more names (e.g. ['Name', 'Price'])",
  dupCol: function(c){ return 'The column name ' + JSON.stringify(c) + ' is used more than once'; },
  badRows: 'rows must be an array of rows',
  badRow: function(i, m, n){ return 'Row ' + (i + 1) + ' has ' + m + ' values but columns has ' + n + '. Make them the same length'; },
  badCell: function(i, c, v){ return 'Row ' + (i + 1) + ', ' + c + ': ' + JSON.stringify(v) + ' must be a string, a number or null'; },
  badSort: function(c){ return 'sort.column ' + JSON.stringify(c) + ' is not in columns'; },
  badHidden: function(c){ return 'hidden: ' + JSON.stringify(c) + ' is not in columns'; },
  badView: "view must be 'table' or 'list'"
};
/* ---- data を確かめる ---- */
var COLS = data.columns, ROWS = data.rows;
if (!Array.isArray(COLS) || !COLS.length || COLS.some(function(c){ return typeof c !== 'string' || !c; })) throw new Error(E.badCols);
COLS.forEach(function(c, j){ if (COLS.indexOf(c) !== j) throw new Error(E.dupCol(c)); });
if (!Array.isArray(ROWS)) throw new Error(E.badRows);
ROWS.forEach(function(r, i){
  var m = Array.isArray(r) ? r.length : 0;
  if (m !== COLS.length) throw new Error(E.badRow(i, m, COLS.length));
  r.forEach(function(v, j){
    if (!(v === null || typeof v === 'string' || (typeof v === 'number' && isFinite(v)))) throw new Error(E.badCell(i, COLS[j], v));
  });
});
if (data.view != null && data.view !== 'table' && data.view !== 'list') throw new Error(E.badView);
if (data.sort && COLS.indexOf(data.sort.column) < 0) throw new Error(E.badSort(data.sort.column));
(data.hidden || []).forEach(function(c){ if (COLS.indexOf(c) < 0) throw new Error(E.badHidden(c)); });

/* ---- 見る人の操作(表示・並び順・隠した列)は保存する ---- */
var view, sortCol, sortDesc, hidden;
function setState(s){
  view = s && s.view === 'list' ? 'list' : 'table';
  sortCol = s && s.sort ? COLS.indexOf(s.sort.column) : -1;
  sortDesc = sortCol >= 0 && !!s.sort.desc;
  hidden = {};
  ((s && s.hidden) || []).forEach(function(c){ var j = COLS.indexOf(c); if (j > 0) hidden[j] = true; });
  if (hidden[sortCol]) sortCol = -1;
}
var INIT = { view: data.view || 'table', sort: data.sort || null, hidden: data.hidden || [] };
var saved = null;
try { saved = HW.getState(null); } catch (e) {}
setState(saved && typeof saved === 'object' ? saved : INIT);
function save(){
  try { HW.setState({ view: view, sort: sortCol < 0 ? null : { column: COLS[sortCol], desc: sortDesc }, hidden: COLS.filter(function(c, j){ return hidden[j]; }) }); } catch (e) {}
}

/* 値がすべて数値(か null)の列は数値の列 */
var NUMCOL = COLS.map(function(c, j){
  var any = false;
  return ROWS.every(function(r){ if (typeof r[j] === 'number') any = true; return r[j] === null || typeof r[j] === 'number'; }) && any;
});
/* 小数の桁は列ごとにそろえる(4 と 4.6 なら 4.0) */
var DEC = COLS.map(function(c, j){
  return ROWS.reduce(function(m, r){ var v = r[j]; return typeof v === 'number' ? Math.max(m, (String(v).split('.')[1] || '').length) : m; }, 0);
});
function cell(v, j){ return v === null ? '' : typeof v === 'number' ? v.toLocaleString(LOC, { minimumFractionDigits: DEC[j], maximumFractionDigits: DEC[j] }) : String(v); }
function dirWord(j, desc){ return NUMCOL[j] ? (desc ? T.numDesc : T.numAsc) : (desc ? T.txtDesc : T.txtAsc); }
function visCols(){ return COLS.map(function(c, j){ return j; }).filter(function(j){ return !hidden[j]; }); }
/* 並び替え。null は最後 */
function sorted(){
  var idx = ROWS.map(function(r, i){ return i; });
  if (sortCol < 0) return idx;
  var j = sortCol, dir = sortDesc ? -1 : 1;
  return idx.sort(function(a, b){
    var x = ROWS[a][j], y = ROWS[b][j];
    if (x === null || y === null) return x === y ? a - b : x === null ? 1 : -1;
    var c = typeof x === 'number' && typeof y === 'number' ? x - y : typeof x === 'number' ? -1 : typeof y === 'number' ? 1 : x.localeCompare(y, LOC, { numeric: true });
    return c ? c * dir : a - b;
  });
}

/* ---- アイコン ---- */
function svg(size, box, body){ return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + box + ' ' + box + '" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>'; }
function dot(sign){ return svg(15, 16, '<circle cx="8" cy="8" r="7" fill="currentColor" stroke="none"/><path d="' + sign + '" stroke="var(--bg)" stroke-width="1.7"/>'); }
var IC = {
  up: svg(11, 12, '<path d="M6 10V2M2.5 5.5L6 2l3.5 3.5" stroke-width="1.7"/>'),
  down: svg(11, 12, '<path d="M6 2v8M2.5 6.5L6 10l3.5-3.5" stroke-width="1.7"/>'),
  chev: svg(8, 8, '<path d="M1.5 3L4 5.5 6.5 3"/>'),
  table: svg(14, 14, '<rect x="1.5" y="2" width="11" height="10" rx="1.5" stroke-width="1.3"/><path d="M1.5 5.5h11M1.5 8.7h11M5.3 2v10" stroke-width="1.3" stroke-linecap="butt"/>'),
  list: svg(14, 14, '<path d="M1.5 3h4M1.5 8.5h4M8 3h4.5M8 5.2h4.5M8 8.5h4.5M8 10.7h4.5" stroke-width="1.3"/>'),
  reset: svg(13, 14, '<path d="M2.5 7a4.5 4.5 0 1 0 1.4-3.3M2.5 2v2.5H5"/>'),
  gear: svg(17, 16, '<circle cx="8" cy="8" r="6" stroke-width="2.1" stroke-dasharray="2.356 2.356" stroke-linecap="butt"/><circle cx="8" cy="8" r="4.4" stroke-width="1.6"/><circle cx="8" cy="8" r="1.7"/>'),
  minus: dot('M4.6 8h6.8'),
  plus: dot('M8 4.6v6.8M4.6 8h6.8')
};
function btn(cls, attrs, body){ return '<button type="button" class="' + cls + '"' + attrs + '>' + body + '</button>'; }

/* draft: 列を選んでいるあいだの下書き。すべての列を出し、並び替えの印は出さない */
var draft = null, menu = null, misTop = 0;   // menu: null | 'sort' | 'edit'
function shownCols(){ return draft ? COLS.map(function(c, j){ return j; }) : visCols(); }
function isOn(j){ return !draft && j === sortCol; }
function isHd(j){ return !!(draft && draft[j]); }
function cls(base, j){ return base + (isOn(j) ? ' on' : '') + (isHd(j) ? ' hd' : ''); }
function arrow(){ return sortDesc ? IC.down : IC.up; }
/* 変更が無ければ「表示列を修正」は押せない */
function changed(){ return COLS.some(function(c, j){ return !!draft[j] !== !!hidden[j]; }); }
function mark(j){ return '<span class="mk">' + (draft[j] ? IC.plus : IC.minus) + '</span>'; }
function markLabel(j){ return ' aria-label="' + esc(draft[j] ? T.showCol(COLS[j]) : T.hideCol(COLS[j])) + '"'; }
function cancelBtn(){ return btn('cc', '', T.cancel); }
function okBtn(){ return btn('ok', changed() ? '' : ' disabled', T.ok); }

/* ---- 表と2列の HTML ---- */
/* 見出し: 押すと並び替え。列を選ぶあいだは隠す・戻す(1列目は不可) */
function head(j){
  var pick = draft && j;
  return btn(cls('hb', j), ' data-j="' + j + '"' + (pick ? markLabel(j) : '') + (draft && !j ? ' disabled' : ''),
    (pick ? mark(j) : '') + esc(COLS[j]) + (isOn(j) ? arrow() : ''));
}
function tableHtml(){
  var vis = shownCols();
  return '<div class="scw"><div class="sc"><table><thead><tr>' + vis.map(function(j){
    return '<th class="' + cls(NUMCOL[j] ? 'n' : '', j) + '">' + head(j) + '</th>';
  }).join('') + '<th class="g">' + (draft ? '' : btn('gr', ' aria-label="' + T.cols + '"', IC.gear)) + '</th></tr></thead><tbody>' + sorted().map(function(i){
    return '<tr>' + vis.map(function(j){
      var v = ROWS[i][j];
      return '<td data-r="' + i + '" data-c="' + j + '" class="' + cls(typeof v === 'number' ? 'n' : '', j) + '">' + esc(cell(v, j)) + '</td>';
    }).join('') + '<td class="g"></td></tr>';
  }).join('') + '</tbody></table></div></div>';
}
function listHtml(){
  var vis = shownCols().slice(1);
  return '<div class="ls">' + sorted().map(function(i){
    return '<div class="row" data-r="' + i + '"><div class="t">' + esc(cell(ROWS[i][0], 0)) + '</div><div class="at">' + vis.map(function(j){
      var v = ROWS[i][j];
      return '<div class="' + cls('a', j) + '"><span class="k">' + esc(COLS[j]) + '</span><span class="v' + (typeof v === 'number' ? ' n' : '') + '">' + esc(cell(v, j)) + '</span></div>';
    }).join('') + '</div></div>';
  }).join('') + '</div>';
}
/* 2列の並び替えボタンとメニュー(並び替え・リセット・非表示設定 / 非表示設定のあいだは −・+ と修正・キャンセル) */
function sortButton(){
  var on = sortCol >= 0;
  return btn('sb' + (on ? ' on' : ''), ' aria-haspopup="true" aria-expanded="' + !!menu + '"' + (on ? ' aria-label="' + esc(T.sortBy + ': ' + COLS[sortCol] + ' ' + dirWord(sortCol, sortDesc)) + '"' : ''),
    '<span class="sl">' + esc(on ? COLS[sortCol] : T.sortBy) + '</span>' + (on ? arrow() : '<span class="cv">' + IC.chev + '</span>'));
}
function menuHtml(){
  if (menu === 'edit') return '<div class="mis">' + COLS.map(function(c, j){
    return j ? btn('mi' + (draft[j] ? ' hd' : ''), ' data-j="' + j + '"' + markLabel(j), mark(j) + esc(c)) : '<div class="mi lock"><span class="mk"></span>' + esc(c) + '</div>';
  }).join('') + '</div><div class="mf">' + okBtn() + cancelBtn() + '</div>';
  return '<div class="mis">' + visCols().map(function(j){
    return btn('mi' + (isOn(j) ? ' on' : ''), ' data-j="' + j + '"', esc(COLS[j]) + (isOn(j) ? '<span class="ar">' + arrow() + '</span>' : ''));
  }).join('') + (sortCol >= 0 ? btn('mi g mr', '', IC.reset + T.resetSort) : '') + '<div class="sep"></div>' + btn('mi g mg', '', IC.gear + T.hideSet) + '</div>';
}

/* 描き替え。動いた行はすべらせる(FLIP) */
var BD;
var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function paint(html, fade){
  var before = {};
  [].forEach.call(BD.querySelectorAll('[data-r]'), function(el){ before[el.dataset.r + '|' + (el.dataset.c || '')] = el.getBoundingClientRect().top; });
  var old = BD.querySelector('.sc'), sl = old ? old.scrollLeft : 0;
  var oldV = BD.querySelector('.sc,.ls'), st = oldV && !fade ? oldV.scrollTop : 0;   // 表示を切り替えたときだけ先頭へ
  BD.innerHTML = html;
  var sc = BD.querySelector('.sc'), ls = BD.querySelector('.ls');
  if (ls) ls.scrollTop = st;
  var v = sc || ls;
  var below = function(){ BD.classList.toggle('b', v.scrollTop + v.clientHeight < v.scrollHeight - 1); };
  v.addEventListener('scroll', below, { passive: true });
  below();
  if (sc) {
    sc.scrollLeft = sl;
    sc.scrollTop = st;
    var edge = function(){ sc.classList.toggle('l', sc.scrollLeft > 1); sc.parentNode.classList.toggle('r', sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 1); };
    sc.addEventListener('scroll', edge, { passive: true });
    edge();
  }
  if (fade && !REDUCE) { BD.classList.add('fd'); requestAnimationFrame(function(){ requestAnimationFrame(function(){ BD.classList.remove('fd'); }); }); return; }
  if (REDUCE) return;
  [].forEach.call(BD.querySelectorAll('[data-r]'), function(el){
    var t = before[el.dataset.r + '|' + (el.dataset.c || '')];
    if (t == null) return;
    var dy = t - el.getBoundingClientRect().top;
    if (Math.abs(dy) < 1) return;
    el.style.transition = 'none';
    el.style.transform = 'translateY(' + dy + 'px)';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      el.style.transition = 'transform .34s cubic-bezier(.2,.8,.2,1)';
      el.style.transform = '';
    }); });
  });
}

R.innerHTML = '<div class="top"><div class="stat"></div><div class="seg" role="group">' + ['table', 'list'].map(function(v){
  return btn('', ' data-v="' + v + '" aria-label="' + T[v] + '"', IC[v]);
}).join('') + '</div></div><div class="bd"></div>';
BD = R.querySelector('.bd');
var STAT = R.querySelector('.stat');

function render(fade){
  R.classList.toggle('edit', !!draft);
  R.classList.toggle('vt', view === 'table');
  [].forEach.call(R.querySelectorAll('[data-v]'), function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === view)); });
  var cnt = '<span class="cnt">' + esc(T.count(ROWS.length)) + '</span>';
  if (view === 'table') STAT.innerHTML = draft ? cancelBtn() + okBtn() : cnt;
  else STAT.innerHTML = cnt + '<div class="dd' + (menu ? ' open' : '') + '">' + sortButton() + '<div class="mn" role="menu">' + menuHtml() + '</div></div>';
  var mis = STAT.querySelector('.mis');
  if (mis) {
    mis.scrollTop = misTop;
    var more = function(){ misTop = mis.scrollTop; mis.classList.toggle('b', mis.scrollTop + mis.clientHeight < mis.scrollHeight - 1); };
    mis.addEventListener('scroll', more, { passive: true });
    more();
  }
  paint(view === 'table' ? tableHtml() : listHtml(), fade);
}
function startEdit(m){ draft = {}; for (var k in hidden) draft[k] = true; menu = m; misTop = 0; }
function stopEdit(){ draft = null; menu = null; }
/* 小さい順 → 大きい順 → 元の順 */
function cycle(j){
  if (sortCol !== j) { sortCol = j; sortDesc = false; }
  else if (!sortDesc) sortDesc = true;
  else sortCol = -1;
}

R.addEventListener('click', function(e){
  var b = e.target.closest('button'), c = b && b.classList;
  if (!b || b.disabled) return;
  if (b.dataset.v) { if (view !== b.dataset.v) { view = b.dataset.v; stopEdit(); save(); render(true); } return; }
  if (b.dataset.j) {
    var j = +b.dataset.j;
    if (draft) { if (draft[j]) delete draft[j]; else draft[j] = true; }
    else { cycle(j); menu = null; save(); }
  }
  else if (c.contains('sb')) { if (menu) stopEdit(); else { menu = 'sort'; misTop = 0; } }
  else if (c.contains('gr')) startEdit(null);     // 表の歯車
  else if (c.contains('mg')) startEdit('edit');   // メニューの「非表示設定」
  else if (c.contains('mr')) { sortCol = -1; menu = null; save(); }   // メニューの「リセット」
  else if (c.contains('cc')) stopEdit();
  else if (c.contains('ok')) { hidden = draft; if (hidden[sortCol]) sortCol = -1; stopEdit(); save(); }
  else return;
  render();
});
/* メニューの外か Esc で閉じる */
function closeMenu(){ if (menu) { stopEdit(); render(); } }
document.addEventListener('click', function(e){
  if (menu && document.contains(e.target) && !R.querySelector('.dd').contains(e.target)) closeMenu();
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeMenu(); });
render();

} catch (e) { R.innerHTML = '<pre style="margin:0;padding:12px;font-size:12px;color:#d33;white-space:pre-wrap;">' + esc(e) + '</pre>'; }
})();
</script>
