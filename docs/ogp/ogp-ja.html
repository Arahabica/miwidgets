<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
background:radial-gradient(900px 500px at 50% 10%,#231c33 0%,#15111d 60%,#100d16 100%);color:#fff}
.bgw{position:absolute;left:60px;top:-10px;width:1080px;height:760px;background:url("../../resources/miwidgets.svg") center/contain no-repeat;opacity:.14;filter:blur(1px)}
.brand{position:absolute;top:42px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;font-size:25px;font-weight:700;letter-spacing:-.3px}
.brand img{width:36px;height:36px}
h1{position:absolute;top:96px;left:0;right:0;margin:0;text-align:center;font-size:60px;line-height:1.18;font-weight:800;letter-spacing:-1.6px}
h1 span{display:block;color:#c9b6ff}
.bubble{position:absolute;top:262px;right:335px;background:#3a5ad1;color:#fff;font-size:19px;padding:12px 22px;border-radius:20px 20px 6px 20px;box-shadow:0 10px 30px #0006}
.card{position:absolute;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px #000a}
.card img{display:block;width:100%}
.w{left:322px;top:330px;width:226px;transform:rotate(-3deg)}
.r{left:556px;top:352px;width:196px;transform:rotate(2deg);background:#fff;padding:6px 4px}
.a{left:760px;top:370px;width:150px;transform:rotate(5deg);background:#fff;padding:4px}
</style></head><body>
<div class="bgw"></div>
<div class="brand"><img src="../../resources/miwidgets.svg" alt="">miwidgets.com</div>
<h1>いつものMuseを、<span>もっと便利に。</span></h1>
<div class="bubble">天気や経路、チャートを見せて</div>
<div class="card w"><img src="../../resources/ogp-weather-widget.png"></div>
<div class="card r"><img src="../../resources/hero-route-widget.webp"></div>
<div class="card a"><img src="../../resources/hero-assets-widget.webp"></div>
</body></html>
