<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muse Inline Widget</title>
<!-- template/ の全テンプレートをチャット風に表示するサンプルページ。
     python3 -m http.server 8000 → http://localhost:8000/ -->
<style>
:root{--bg:#e9e9ee;--card:#fff;--text:#1c1c1e;--muted:#6e6e73;--line:#d1d1d6;--accent:#3a5ad1;}
@media (prefers-color-scheme: dark){
  :root{--bg:#111;--card:#1c1c1e;--text:#f2f2f7;--muted:#98989f;--line:#3a3a3c;--accent:#7d95ff;}
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;}
header{position:sticky;top:0;z-index:1;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;}
h1{font-size:16px;margin:0;}
main{display:flex;flex-wrap:wrap;gap:24px;padding:20px 16px 40px;align-items:flex-start;justify-content:flex-start;}
section{width:440px;max-width:100%;scroll-margin-top:70px;}
section h2{font-size:15px;margin:0 4px 2px;display:flex;align-items:baseline;gap:8px;}
section h2 a{font-size:12px;font-weight:normal;color:var(--muted);}
section p{font-size:12px;color:var(--muted);margin:0 4px 8px;line-height:1.5;}
/* スマホ画面900px + 上下の余白32px */
iframe{display:block;width:100%;height:932px;border:0;background:transparent;}
.err{font-size:13px;line-height:1.7;color:#d33;padding:16px;}
</style>
</head>
<body>
<header>
  <h1>Muse Inline Widget</h1>
</header>
<main id="main"></main>
<template id="preview-shell">
<style>
:root{
  --page-bg:#ffffff;
  --bubble-user-bg:#3a5ad1;
  --bubble-user-text:#ffffff;
  --bubble-ai-bg:#f2f2f7;
  --bubble-ai-text:#1c1c1e;
  --meta-text:#8e8e93;
  /* Muse がウィジェットに渡すテーマ変数(推測) */
  --hatch-widget-text:#1c1c1e;
  --hatch-widget-muted:#6e6e73;
  --hatch-widget-border:#d1d1d6;
}
@media (prefers-color-scheme: dark){
  :root{
    --page-bg:#000000;
    --bubble-ai-bg:#2c2c2e;
    --bubble-ai-text:#f2f2f7;
    --meta-text:#8e8e93;
    --hatch-widget-text:#f2f2f7;
    --hatch-widget-muted:#98989f;
    --hatch-widget-border:#3a3a3c;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:#d9d9de;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%;
}
@media (prefers-color-scheme: dark){ body{background:#111;} }

/* スマホ画面。高さ900pxで固定し、収まらない内容は画面内でスクロールする */
.phone{
  display:flex;flex-direction:column;
  width:100%;max-width:390px;height:900px;overflow-y:auto;
  margin:0 auto;
  background:var(--page-bg);
  position:relative;
}
@media (min-width:430px){
  body{display:flex;align-items:flex-start;justify-content:center;padding:24px 0;}
  .phone{border-radius:28px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
}

.chat{flex:1 0 auto;padding:44px 12px 24px;display:flex;flex-direction:column;gap:10px;}
.stamp{align-self:center;font-size:11px;color:var(--meta-text);margin:2px 0;}

.msg{max-width:88%;}
.msg.user{align-self:flex-end;}
.msg.ai{align-self:flex-start;width:100%;max-width:100%;}
.bubble{border-radius:18px;font-size:14px;line-height:1.55;padding:9px 13px;overflow-wrap:anywhere;}
.msg.user .bubble{background:var(--bubble-user-bg);color:var(--bubble-user-text);border-bottom-right-radius:6px;}
.msg.ai .bubble{background:var(--bubble-ai-bg);color:var(--bubble-ai-text);border-bottom-left-radius:6px;}
/* ウィジェット入りの吹き出し: 余白をなくし、中身を角丸の内側に収める */
.msg.ai .bubble.widget{padding:0;overflow:hidden;}

body{background:transparent;padding:4px 0 28px;}
</style>
<div class="phone"><div class="chat" id="chat"><div class="stamp">今日 9:41</div></div></div>
</template>
<script>
/* プレビュー用のデータはここで管理する。テンプレート本体は template/ に置く。 */
var WEATHER_SCENARIOS = [
  { label: '雨', data: null },
  { label: '晴れ', data: {
      location: '大阪府 大阪市',
      today: { date: '11/17(火)', condition: 'sunny', temp: 22, high: 25, low: 14, pop: 10 },
      hourly: [
        { time: '0時',  condition: 'moon',   temp: 15, pop: 0 },
        { time: '6時',  condition: 'sunny',  temp: 17, pop: 0, current: true },
        { time: '12時', condition: 'sunny',  temp: 24, pop: 10 },
        { time: '18時', condition: 'partly', temp: 21, pop: 10 }
      ] } },
  { label: '晴れ時々くもり', data: {
      location: '宮城県 仙台市',
      today: { date: '11/17(火)', condition: 'partly', temp: 19, high: 21, low: 13, pop: 20 },
      hourly: [
        { time: '0時',  condition: 'moon',   temp: 13, pop: 10 },
        { time: '6時',  condition: 'partly', temp: 15, pop: 10, current: true },
        { time: '12時', condition: 'partly', temp: 20, pop: 20 },
        { time: '18時', condition: 'cloudy', temp: 18, pop: 30 }
      ] } },
  { label: 'くもり', data: {
      location: '愛知県 名古屋市',
      today: { date: '11/17(火)', condition: 'cloudy', temp: 17, high: 19, low: 12, pop: 30 },
      hourly: [
        { time: '0時',  condition: 'cloudy', temp: 13, pop: 20 },
        { time: '6時',  condition: 'cloudy', temp: 14, pop: 30, current: true },
        { time: '12時', condition: 'cloudy', temp: 18, pop: 30 },
        { time: '18時', condition: 'partly', temp: 16, pop: 20 }
      ] } },
  { label: '雷雨', data: {
      location: '福岡県 福岡市',
      today: { date: '11/17(火)', condition: 'thunder', temp: 27, high: 30, low: 22, pop: 90 },
      hourly: [
        { time: '0時',  condition: 'cloudy',  temp: 23, pop: 40 },
        { time: '6時',  condition: 'thunder', temp: 24, pop: 70, current: true },
        { time: '12時', condition: 'thunder', temp: 29, pop: 90 },
        { time: '18時', condition: 'rain',    temp: 25, pop: 60 }
      ] } },
  { label: '雪', data: {
      location: '北海道 札幌市',
      today: { date: '11/17(火)', condition: 'snow', temp: -1, high: 2, low: -4, pop: 70 },
      hourly: [
        { time: '0時',  condition: 'snow',   temp: -3, pop: 60 },
        { time: '6時',  condition: 'snow',   temp: -2, pop: 70, current: true },
        { time: '12時', condition: 'cloudy', temp: 1,  pop: 40 },
        { time: '18時', condition: 'cloudy', temp: -1, pop: 20 }
      ] } },
  { label: '夜', data: {
      location: '京都府 京都市',
      updatedAt: '11/17 21:00 更新',
      today: { date: '11/17(火)', condition: 'moon', temp: 12, high: 15, low: 9, pop: 10 },
      hourly: [
        { time: '0時',  condition: 'moon',  temp: 10, pop: 0 },
        { time: '6時',  condition: 'moon',  temp: 9,  pop: 0 },
        { time: '12時', condition: 'sunny', temp: 14, pop: 0 },
        { time: '18時', condition: 'moon',  temp: 12, pop: 10, current: true }
      ] } }
];
var ROUTE_SCENARIOS = [
  { label: '現在時刻(端末の時計)' },
  { now: '07:40', label: '07:40 出発前' },
  { now: '08:05', label: '08:05 乗車中' },
  { now: '08:20', label: '08:20 乗換(待ち)' },
  { now: '10:50', label: '10:50 乗換(徒歩)' },
  { now: '11:30', label: '11:30 到着後' }
];
var TEMPLATES = [
  { id: 'assets', name: '資産損益推移', file: 'template/assets.html', note: '前日比を強調した折れ線チャート', user: '一週間の資産の推移を見せて', reply: '直近1週間の損益推移です。' },
  { id: 'clock', name: '時計', file: 'template/clock.html', note: '秒針つきのアナログ時計', user: '今の時間を見せて', reply: '現在の時刻です。' },
  { id: 'omikuji', name: 'おみくじ', file: 'template/omikuji.html', note: '箱をタップして引く', user: 'おみくじを引きたい', reply: 'おみくじを用意しました。箱をタップして引いてください。' },
  { id: 'quiz', name: '4択クイズ', file: 'template/quiz.html', note: '選んで「OK」。まちがえた問題は最後にやり直し', user: 'クイズを出して', reply: 'クイズです。答えを選んで「OK」を押してください。' },
  { id: 'secret', name: '秘密のメッセージ', file: 'template/secret.html', note: 'パスコードは 123456', user: '秘密のメッセージを送りたい', reply: '秘密のメッセージを作りました。パスコードは 123456 です。' },
  { id: 'weather', name: '天気', file: 'template/weather.html', note: '雨・晴れ・晴れ時々くもり・くもり・雷雨・雪・夜の7パターン', user: 'いろんな天気を見せて', reply: '各地の今日の天気です。', scenarios: WEATHER_SCENARIOS },
  { id: 'route', name: '乗り換え案内', file: 'template/route.html', note: '端末の時計 + 現在時刻を固定した5パターン', user: '明日の朝、新宿から国際会館までの行き方を教えて', reply: '新宿から国際会館までの経路です。現在時刻に合わせて、次にすることを表示します。', scenarios: ROUTE_SCENARIOS }
];

var main = document.getElementById('main');

if (location.protocol === 'file:') {
  main.innerHTML = '<div class="err">file:// では各プレビューを読み込めません。リポジトリのルートでローカルサーバーを立てて開いてください:<br><code>python3 -m http.server 8000</code> → <code>http://localhost:8000/</code></div>';
} else {
  TEMPLATES.forEach(function(t){
    var sec = document.createElement('section');
    sec.id = t.id;
    sec.innerHTML = '<h2><span></span><a target="_blank"></a></h2><p></p><iframe loading="eager"></iframe>';
    sec.querySelector('h2 span').textContent = t.name;
    var link = sec.querySelector('h2 a');
    link.href = t.file;
    link.textContent = t.file + ' ↗';
    sec.querySelector('p').textContent = t.note;
    var frame = sec.querySelector('iframe');
    frame.title = t.name;
    frame.addEventListener('load', function(){ renderPreview(frame, t); }, {once: true});
    frame.srcdoc = '<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>' + t.name + ' プレビュー</title></head><body>' + document.getElementById('preview-shell').innerHTML + '</body></html>';
    main.appendChild(sec);
  });
}

/* テンプレートごとに iframe を分け、CSS と状態を独立させる。 */
async function renderPreview(frame, t){
  var doc = frame.contentDocument;
  var chat = doc.getElementById('chat');
  function message(kind, text){
    var msg = doc.createElement('div');
    msg.className = 'msg ' + kind;
    var bubble = doc.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    msg.appendChild(bubble);
    chat.appendChild(msg);
    return bubble;
  }
  message('user', t.user);
  message('ai', t.reply);
  try {
    var response = await fetch(t.file, {cache: 'no-store'});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    var source = await response.text();
    (t.scenarios || [{}]).forEach(function(sc, i){
      var mount = message('ai', '');
      mount.classList.add('widget');
      var html = source;
      if (t.id === 'weather') {
        html = html.split('wx1b').join('wx1b_' + i);
        if (sc.data) {
          html = html.replace(/(var data = \{[\s\S]*?\n\};)/, function(m){ return m + '\nObject.assign(data, ' + JSON.stringify(sc.data) + ');'; });
        }
      }
      if (t.id === 'route') {
        html = html.split('route-w').join('route-w' + i);
        if (sc.now) html = html.replace('now: null', "now: '" + sc.now + "'");
      }
      mount.innerHTML = html;
      // innerHTML 内の script を作り直し、各テンプレートを実行する。
      // hatchWidget がない場合、テンプレート自身が独立したメモリ上の状態を用意する。
      mount.querySelectorAll('script').forEach(function(old){
        var el = doc.createElement('script');
        el.textContent = old.textContent;
        old.replaceWith(el);
      });
    });
  } catch (err) {
    var error = doc.createElement('div');
    error.style.cssText = 'padding:12px;font-size:12px;color:#d33;';
    error.textContent = t.file + ' を読み込めません(' + String(err) + ')。';
    chat.appendChild(error);
  }
}
</script>
</body>
</html>
