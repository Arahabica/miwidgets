<!-- おみくじテンプレート: 和紙色の背景に、水彩・絵本風のおみくじ箱(画像は背景が透明な WebP を data URI で埋め込み)。箱をタップすると箱だけが揺れ(地面の影は動かない)、そのあと和紙の短冊に縦書きで運勢を表示する。結果は引く前から決まっていて、HTML には今日の結果1件だけを入れる(抽選はしない)。引いたかどうかは保存される。結果の内容はスクリプト冒頭の data で変更できる。 -->
<div id="omikuji-w"></div>
<style>
#omikuji-w{box-sizing:border-box;width:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%;}
#omikuji-w *{box-sizing:border-box;}
#omikuji-w button{font:inherit;color:inherit;}

#omikuji-w{padding:14px;background:#f4ecd8;color:#3b2a1a;text-align:center;}
#omikuji-w .hd{display:inline-block;padding:2px 18px;font-size:12px;letter-spacing:.5em;color:#fff;background:#c8102e;border-radius:3px;}
#omikuji-w .slip{background:#fffaf0;border:1px solid #d9c6a0;border-top:5px solid #c8102e;border-bottom:5px solid #c8102e;padding:12px 12px 10px;text-align:left;animation:om1u .9s ease-out;}
@keyframes om1u{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
#omikuji-w .slip .hd{display:block;text-align:center;background:none;color:#c8102e;letter-spacing:.6em;margin-bottom:8px;border-bottom:1px solid #d9c6a0;border-radius:0;padding:0 0 6px;}
#omikuji-w .bd{display:flex;gap:12px;align-items:flex-start;}
#omikuji-w .nm{writing-mode:vertical-rl;font-size:44px;font-weight:800;line-height:1;letter-spacing:.08em;color:var(--c);flex:none;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;}
#omikuji-w .ms{writing-mode:vertical-rl;font-size:13px;line-height:1.9;height:178px;flex:none;color:#5a4630;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;}
#omikuji-w .it{list-style:none;margin:0;padding:0;flex:1;min-width:0;}
#omikuji-w .it li{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px dotted #d9c6a0;font-size:12.5px;line-height:1.45;}
#omikuji-w .it b{flex:none;color:#c8102e;font-size:11px;border:1px solid #c8102e;border-radius:3px;padding:0 4px;}
#omikuji-w .lks{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;padding-top:8px;border-top:1px solid #d9c6a0;font-size:11px;color:#6b5238;}
#omikuji-w .lk i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;border:1px solid rgba(0,0,0,.2);}
#omikuji-w .box{display:block;position:relative;z-index:1;margin:0 auto;border:none;background:none;padding:0;cursor:pointer;width:89px;transform-origin:50% 100%;}
#omikuji-w .box svg,#omikuji-w .box img{display:block;width:100%;height:auto;}
#omikuji-w .box.shake{animation:om2s 1s ease-in-out;}
@keyframes om2s{0%,100%{transform:rotate(0) translateY(0)}10%{transform:rotate(-12deg) translateY(-6px)}20%{transform:rotate(12deg)}30%{transform:rotate(-12deg) translateY(-6px)}40%{transform:rotate(12deg)}50%{transform:rotate(-10deg) translateY(-4px)}60%{transform:rotate(10deg)}75%{transform:rotate(-5deg)}90%{transform:rotate(3deg)}}
#omikuji-w .gd{margin:8px 0 4px;font-size:13px;color:#5a4630;}

#omikuji-w .pre .hd{position:relative;z-index:2;}
#omikuji-w .stage{margin-top:18px;}
#omikuji-w .gnd{display:block;width:100px;height:14px;margin:-9px auto 0;border-radius:50%;background:radial-gradient(closest-side,rgba(90,60,20,.32),rgba(90,60,20,0));}
</style>
<script>
(function(){
var R = document.getElementById("omikuji-w");
try {
/* Muse 以外のブラウザでも動くよう、hatchWidget が無ければメモリ上の代替を使う */
var HW = window.hatchWidget || (function(){ var s = null; return { getState: function(d){ return s === null ? d : s; }, setState: function(v){ s = v; } }; })();

/* ===== data: 今日の結果(引く前から決まっている)。ウィジェットにはこの1件だけを入れる =====
 * 引く操作は「結果を開く」演出で、抽選はしない。値を入れ替えるだけで別の結果になる。 */
var data = {
  title: 'おみくじ',                      // string: 見出し
  result: {
    name: '大吉',                         // string: 運勢の名前
    color: '#ffb300',                     // string: 運勢の文字の色(CSSの色)
    message: '思い描いた通りに運ぶ日。迷わず一歩を踏み出して。',   // string: ひとこと(縦書きで表示)
    /* 項目ごとの結果。型: [項目名: string, ひとこと: string][] ・何件でもよい */
    items: [
      ['願望', '叶う。信じて進むべし'],
      ['恋愛', '良縁あり。素直に伝えよ'],
      ['学業', '努力が実を結ぶ'],
      ['仕事', '好機到来。任された事は引き受けよ'],
      ['金運', '思わぬ収入あり']
    ],
    /* ラッキー要素。型: { color: { name: string, hex: string }, number: number, item: string }。不要なら lucky ごと削除 */
    lucky: { color: { name: '青', hex: '#3a5ad1' }, number: 42, item: '文庫本' }
  }
};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* 「引いたかどうか」だけを保存する。結果そのものは data に入っている。 */
var st = HW.getState({ drawn: false });
if (!st || typeof st.drawn !== 'boolean') st = { drawn: false };
function save(n){ st = n; try { HW.setState(st); } catch (e) {} }
function luckyHtml(l){
  if (!l) return '';
  return '<span class="lk"><i style="background:' + esc(l.color.hex) + '"></i>ラッキーカラー ' + esc(l.color.name) + '</span><span class="lk">ラッキー番号 ' + esc(l.number) + '</span><span class="lk">ラッキー品 ' + esc(l.item) + '</span>';
}
var busy = false;

  var res = data.result;
  if (!st.drawn) {
