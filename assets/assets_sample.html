<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>assets.html プレビュー(Muse チャット画面の再現)</title>
<!--
  Muse のモバイルチャット画面を模したプレビュー用ページ。
  assets.html を fetch で読み込み、アシスタントの吹き出し(角丸の四角)の中に表示する。
  ※ 見た目は推測による再現で、実際の Muse の画面とは異なる。
  ※ fetch を使うため、ローカルサーバー経由で開く必要がある(file:// では読み込めない)。
     例: cd assets && python3 -m http.server 8000 → http://localhost:8000/assets_sample.html
-->
<style>
:root{
  --page-bg:#ffffff;
  --bubble-user-bg:#3a5ad1;
  --bubble-user-text:#ffffff;
  --bubble-ai-bg:#f2f2f7;
  --bubble-ai-text:#1c1c1e;
  --meta-text:#8e8e93;
  /* Muse がウィジェットに渡すテーマ変数(推測) */
  --hatch-widget-text:#1c1c1e;
  --hatch-widget-muted:#6e6e73;
  --hatch-widget-border:#d1d1d6;
}
@media (prefers-color-scheme: dark){
  :root{
    --page-bg:#000000;
    --bubble-ai-bg:#2c2c2e;
    --bubble-ai-text:#f2f2f7;
    --meta-text:#8e8e93;
    --hatch-widget-text:#f2f2f7;
    --hatch-widget-muted:#98989f;
    --hatch-widget-border:#3a3a3c;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  background:#d9d9de;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%;
}
@media (prefers-color-scheme: dark){ body{background:#111;} }

/* スマホ画面。PCでは幅390pxの端末風、実機ではそのまま全画面 */
.phone{
  display:flex;flex-direction:column;
  width:100%;max-width:390px;height:100vh;height:100dvh;max-height:844px;
  margin:0 auto;
  background:var(--page-bg);
  position:relative;overflow:hidden;
}
@media (min-width:430px){
  body{display:flex;align-items:center;justify-content:center;}
  .phone{border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.25);}
}

.chat{flex:1;overflow-y:auto;padding:44px 12px 16px;display:flex;flex-direction:column;gap:10px;}
.stamp{align-self:center;font-size:11px;color:var(--meta-text);margin:2px 0;}

.msg{max-width:88%;}
.msg.user{align-self:flex-end;}
.msg.ai{align-self:flex-start;width:100%;max-width:100%;}
.bubble{border-radius:18px;font-size:14px;line-height:1.55;padding:9px 13px;overflow-wrap:anywhere;}
.msg.user .bubble{background:var(--bubble-user-bg);color:var(--bubble-user-text);border-bottom-right-radius:6px;}
.msg.ai .bubble{background:var(--bubble-ai-bg);color:var(--bubble-ai-text);border-bottom-left-radius:6px;}
/* ウィジェット入りの吹き出し: 余白をなくし、中身を角丸の内側に収める */
.msg.ai .bubble.widget{padding:0;overflow:hidden;}
</style>
</head>
<body>
<div class="phone">
  <div class="chat">
    <div class="stamp">今日 9:41</div>

    <div class="msg user"><div class="bubble">一週間の資産の推移を見せて</div></div>

    <div class="msg ai"><div class="bubble">直近1週間の損益推移です。</div></div>

    <div class="msg ai">
      <div class="bubble widget">
<div id="mount"></div>
      </div>
    </div>
  </div>
</div>
<script>
/* assets.html を読み込んで #mount に差し込む。保存→リロードで最新が反映される */
(function(){
  var mount = document.getElementById('mount');
  fetch('assets.html', {cache: 'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(html){
      mount.innerHTML = html;
      // innerHTML で差し込んだ <script> は実行されないため、作り直して実行させる
      mount.querySelectorAll('script').forEach(function(old){
        var el = document.createElement('script');
        el.textContent = old.textContent;
        old.replaceWith(el);
      });
    })
    .catch(function(err){
      mount.innerHTML = '<div style="padding:12px;font-size:12px;line-height:1.6;color:#d33;">assets.html を読み込めません(' + String(err).replace(/</g,'&lt;') + ')。<br>file:// で開いている場合は、ローカルサーバー経由で開いてください:<br><code>cd assets &amp;&amp; python3 -m http.server 8000</code></div>';
    });
})();
</script>
</body>
</html>
