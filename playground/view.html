<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>テンプレート単体</title>
<!--
  テンプレートを1つだけ、スマホの画面いっぱいに表示する開発用ページ。配信はしない(playground/ ごと .assetsignore で除外)。
  - view.html?t=sheet_8_edit のように t にテンプレート名(template/ 以下のファイル名から .html を除いたもの)を渡す
  - t が無いときはテンプレートの一覧を出す
  - lang=en を付けると data.lang = 'en' で表示する
  - ライト・ダークは端末の設定に合わせる
  - template/*.html を保存すると、1秒以内に描き直す
  同じ LAN のスマホからは http://<Mac の IP>:8000/playground/view.html で開く(python3 -m http.server 8000 は全インターフェースで待ち受ける)。
-->
<style>
:root{--bg:#fff;--bubble:#f2f2f7;--text:#1c1c1e;--muted:#6e6e73;--line:#d1d1d6;--accent:#3a5ad1;--err:#d33;color-scheme:light dark;}
@media (prefers-color-scheme: dark){:root{--bg:#000;--bubble:#2c2c2e;--text:#f2f2f7;--muted:#98989f;--line:#3a3a3c;--accent:#7b93ff;}}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;padding:12px 12px calc(24px + env(safe-area-inset-bottom));}
header{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin:0 2px 10px;}
header b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
header a{color:var(--accent);text-decoration:none;white-space:nowrap;}
.bubble{background:var(--bubble);border-radius:18px;overflow:hidden;}
iframe{display:block;width:100%;border:0;height:80px;}
.errs{margin-top:8px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--err);white-space:pre-wrap;}
.errs:empty{display:none;}
h1{font-size:17px;margin:4px 2px 12px;}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);}
li a{display:block;padding:12px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;}
li a:active{background:var(--bubble);}
li small{display:block;font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var THEME = {
  light: '--hatch-widget-text:#1c1c1e;--hatch-widget-muted:#6e6e73;--hatch-widget-border:#d1d1d6;',
  dark: '--hatch-widget-text:#f2f2f7;--hatch-widget-muted:#98989f;--hatch-widget-border:#3a3a3c;'
};
var q = new URLSearchParams(location.search), id = q.get('t'), en = q.get('lang') === 'en';
var app = document.getElementById('app');
var dark = matchMedia('(prefers-color-scheme: dark)');
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* register.txt と template/ のディレクトリ一覧から、テンプレートを集める(playground/index.html と同じ) */
async function list(){
  var out = [];
  var lines = (await (await fetch('/register.txt', { cache: 'no-store' })).text()).split('\n');
  lines.forEach(function(line, i){
    var m = /^https:\/\/miwidgets\.com\/template\/([\w-]+)\.html\s*$/.exec(line);
    if (m) out.push({ id: m[1], name: (lines[i - 1] || '').split(' — ')[0] || m[1] });
  });
  try {
    var dir = await (await fetch('/template/', { cache: 'no-store' })).text();
    (dir.match(/href="([\w-]+)\.html"/g) || []).forEach(function(h){
      var tid = /href="([\w-]+)\.html"/.exec(h)[1];
      if (!out.some(function(t){ return t.id === tid; })) out.push({ id: tid, name: tid, draft: true });
    });
  } catch (e) {}
  return out;
}

if (!id) {
  list().then(function(ts){
    app.innerHTML = '<h1>テンプレート</h1><ul>' + ts.map(function(t){
      return '<li><a href="?t=' + encodeURIComponent(t.id) + (en ? '&lang=en' : '') + '">' + esc(t.name) + '<small>' + (t.draft ? '未登録 · ' : '') + esc(t.id) + '</small></a></li>';
    }).join('') + '</ul>';
  });
  return;
}

var other = '?t=' + encodeURIComponent(id) + (en ? '' : '&lang=en');
app.innerHTML = '<header><b>' + esc(id) + (en ? ' · en' : '') + '</b><a href="' + other + '">' + (en ? '日本語' : 'English') + '</a><a href="?' + (en ? 'lang=en' : '') + '">一覧</a></header>' +
  '<div class="bubble"><iframe></iframe></div><div class="errs"></div>';
var frame = app.querySelector('iframe'), errs = app.querySelector('.errs'), source = null;

function fit(){
  try { frame.style.height = Math.max(40, frame.contentDocument.documentElement.scrollHeight) + 'px'; } catch (e) {}
}
frame.addEventListener('load', function(){
  fit();
  try { new frame.contentWindow.ResizeObserver(fit).observe(frame.contentDocument.documentElement); } catch (e) {}
});
window.addEventListener('message', function(ev){
  if (ev.data && ev.data.pg) errs.textContent += ev.data.msg + '\n';
});

function render(){
  var body = source;
  if (en) body = body.replace(/(^[ \t]*var data = \{[\s\S]*?^[ \t]*\};[ \t]*$)/m, "$1\ndata.lang = 'en';");
  var hook = '<script>window.onerror=function(m,s,l){parent.postMessage({pg:1,msg:m+(l?" (line "+l+")":"")},"*");};<\/script>';
  errs.textContent = '';
  frame.srcdoc = '<!doctype html><html lang="' + (en ? 'en' : 'ja') + '"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<style>html,body{margin:0;background:transparent;}:root{' + THEME[dark.matches ? 'dark' : 'light'] + '}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;}</style>' +
    hook + '</head><body>' + body + '</body></html>';
}

/* テンプレートを読み直す。変わったときだけ描き直す(触っている途中で状態が消えないように) */
async function refresh(){
  var src;
  try {
    var res = await fetch('/template/' + id + '.html', { cache: 'no-store' });
    if (!res.ok) { errs.textContent = 'template/' + id + '.html が見つかりません'; return; }
    src = await res.text();
  } catch (e) { return; }
  if (src === source) return;
  source = src;
  render();
}
dark.addEventListener('change', function(){ if (source !== null) render(); });
refresh();
setInterval(refresh, 1000);
})();
</script>
</body>
</html>
